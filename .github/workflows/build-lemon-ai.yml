          Ollama : necessite son installation et un modele sur votre PC.
          Un resume du projet n'est envoye aux IA en ligne qu'avec votre accord.
          Ce n'est pas encore une fenetre integree dans Lemon Studio :
          il s'agit d'un assistant compagnon experimental.

          La validation des modifications doit toujours etre faite dans Lemon Studio.
          Travaillez sur des copies de projets .flp. Logiciel en pre-alpha.
          Le code source de l'assistant est inclus pour inspection et modification.
          Projet original : https://github.com/ItsAlphaNeon/Lemon-Studio
          Fork : https://github.com/dedmauhaze/Lemon-Studio
          '@ | Set-Content -LiteralPath 'Lemon-Studio-FR-AI\LISEZ-MOI-ASSISTANT.txt' -Encoding utf8

