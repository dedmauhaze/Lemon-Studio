          def test_style_grooves():
              """Regression: identical French prompt yields musically different quantized MIDI by genre."""
              roots = normalize({'title':'Roots','bpm':78,'tonic':'G','scale':'major','style':'frenchcore'},
                  'Compose un reggae roots en 4/4 à 78 BPM, avec One Drop et skank, 3 minutes')
              assert roots['style']=='reggae' and roots['bpm']==78, roots
              assert infer_style('Dub roots, skank syncopé')=='reggae'
              assert infer_bpm('Crée un reggae instrumental')==78
              assert infer_style('Frenchcore mélodique')=='frenchcore'
              for ppq in (96,480):
                  for sec in range(8):
                      kick=section_notes('kick',sec,4,ppq,roots,12)
                      snare=section_notes('snare',sec,4,ppq,roots,13)
                      assert [n['position'] for n in kick]==[b*4*ppq+2*ppq for b in range(4)]
                      assert [n['position'] for n in snare]==[n['position'] for n in kick]
                      hats=section_notes('hat',sec,4,ppq,roots,14)
                      offbeat_positions={b*4*ppq+k*ppq+ppq//2 for b in range(4) for k in range(4)}
                      assert offbeat_positions <= {n['position'] for n in hats}
                      pad=section_notes('pad',sec,4,ppq,roots,15)
                      assert all((n['position']%ppq)==ppq//2 for n in pad)
                      organ=section_notes('arp',sec,4,ppq,roots,16)
                      assert all(n['position']%ppq in (ppq//2, ppq//4) for n in organ)
                      bass=section_notes('bass',sec,4,ppq,roots,17)
                      assert all(n['position']%ppq in (0,ppq//2) for n in bass)
              hard=normalize({'bpm':200}, 'Frenchcore 200 BPM, 1 minute')
              assert hard['style']=='frenchcore'
              kicks=section_notes('kick',3,2,96,hard,1)
              assert {0,96,192,288} <= {n['position'] for n in kicks}
              assert {0,96,192,288} != {n['position'] for n in section_notes('kick',3,1,96,roots,1)}
              print('Reggae One Drop / skank / organ bubble / basse syncopée : tests OK')
          
          def test_selection_v09():
              """Evidence: audio fit and the kit matter more than alphabetical filenames."""
              with tempfile.TemporaryDirectory() as tmp:
                  base=Path(tmp);pack=base/'Professional Pack';pack.mkdir()
                  def wav(name,hz,duration,shape='sine'):
                      path=pack/name;rate=22050;frames=[]
                      for idx in range(int(rate*duration)):
                          t=idx/rate
                          env=math.exp(-t*(8 if shape=='kick' else 1 if shape=='bass' else 6))
                          x=math.sin(2*math.pi*hz*t)*env*.78
                          frames.append(struct.pack('<h',int(x*32767)))
                      with wave.open(str(path),'wb') as out:
                          out.setnchannels(1);out.setsampwidth(2);out.setframerate(rate)
                          out.writeframes(b''.join(frames))
                      return path
                  bad=wav('Frenchcore_Kick_000.wav',65,2.1,'bass')
                  good=wav('Frenchcore_Kick_999.wav',65,.31,'kick')
                  sub=wav('Frenchcore_Bass_999.wav',60,.65,'bass')
                  bad_bass=wav('Frenchcore_Bass_000.wav',4000,.65,'sine')
                  lead_wrong=wav('Frenchcore_Lead_C_minor_01.wav',440,.65)
                  lead_right=wav('Frenchcore_Lead_D_minor_02.wav',440,.65)
                  before={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in pack.iterdir()}
                  cfg=normalize({},'Compose Frenchcore moderne en Ré mineur 200 BPM')
                  ranked,scanned=find_pack_candidates([pack],'Frenchcore 200 BPM')
                  assert scanned==6
                  assert _audio_features(good)['tail_s']< _audio_features(bad)['tail_s']
                  pitched=rerank_harmonic_candidates(ranked,cfg)
                  chosen,audit=select_compatible_samples(pitched,cfg)
                  assert chosen['kick']==str(good) and chosen['bass']==str(sub),chosen
                  assert chosen['lead']==str(lead_right),chosen
                  assert audit['kick']['analysed'] and audit['kick']['alternative']
                  # Even when Qwen proposes the inferior first file, audio fit wins.
                  alternative,_=select_compatible_samples(pitched,cfg,{'kick':str(bad),'bass':str(bad_bass)})
                  assert alternative['kick']==str(good) and alternative['bass']==str(sub)
                  assert len(set(chosen.values()))==len(chosen)
                  # A relative key is not a mismatched key.
                  a={'path':str(lead_right),'key_label':('D','minor')}
                  b={'path':str(lead_wrong),'key_label':('F','major')}
                  assert _sample_pair_score('lead',a,'pad',b,cfg)>0
                  after={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in pack.iterdir()}
                  assert before==after,'Sample sources altered by the selection scan'
                  print('V0.10: audio shortlist, best-pair selection, key compatibility, read-only checks OK')
          
          
