                  self.chat.pack(fill=BOTH, expand=True, padx=18, pady=(7, 12))
                  self.chat.tag_configure("user", foreground="#f2bd55", spacing1=5, spacing3=5)
                  self.chat.tag_configure("assistant", foreground=ink, spacing1=5, spacing3=9)
                  self.chat.tag_configure("system", foreground="#b2c8e2", spacing1=5, spacing3=10)
                  self._chat("system", "V0.13 — Intro Frenchcore progressive et boucles à BPM incompatible mieux filtrées, Lead/Arpège plus stricts, queues de réverbération/écho protégées, plugins de mixage activés prudemment, kicks complets + accords et BPM vérifiés. Trois themes mélodiques (drops A/B et break) préparés par Ollama, progression réelle sur quatre accords, silences et orchestration évolutive. Contrôle des chevauchements de samples longs et niveaux moins atténués. Les packs d'origine restent intacts. Pour un projet V0.5 déjà ouvert, clique sur « Rééquilibrer volume du projet ». Le résultat est toujours une MAQUETTE, pas un master garanti sans clipping.\n\nLe bouton « Proposer » conserve les anciennes commandes.\n")
          
                  ttk.Label(self.root, text="Ton instruction", background=bg, foreground=ink,
                            font=("Segoe UI", 10, "bold")).pack(anchor="w", padx=18)
                  self.prompt = Text(self.root, height=3, bg=panel, fg=ink, insertbackground=ink,
                                     relief="flat", padx=10, pady=8, wrap="word", font=("Segoe UI", 10))
                  self.prompt.pack(fill=X, padx=18, pady=(5, 10))
                  self.prompt.bind("<Control-Return>", lambda _: self._submit())
                  self.prompt.bind("<Control-Shift-Return>", lambda _: self._compose())
                  bottom = ttk.Frame(self.root, style="AI.Head.TFrame")
                  bottom.pack(fill=X, padx=18, pady=(0, 5))
                  self.submit = ttk.Button(bottom, text="Proposer (Ctrl+Entrée)", command=self._submit)
                  self.submit.pack(side=LEFT, padx=(0, 7))
                  self.compose_button = ttk.Button(bottom, text="Composer un morceau (1 prompt)", command=self._compose)
                  self.compose_button.pack(side=LEFT)
                  ttk.Button(bottom, text="Actualiser l'état", command=self._refresh_state).pack(side=RIGHT)
                  fixbar=ttk.Frame(self.root, style="AI.Head.TFrame")
                  fixbar.pack(fill=X, padx=18, pady=(0,5))
                  self.rebalance_button=ttk.Button(fixbar, text="Rééquilibrer volume du projet V0.5", command=self._rebalance)
                  self.rebalance_button.pack(side=LEFT)
                  ttk.Label(fixbar, text="Sur les canaux créés par le compositeur uniquement", foreground=muted,
                            background=bg, font=("Segoe UI", 9)).pack(side=LEFT, padx=(12,0))
                  ttk.Label(self.root, textvariable=self.status, background=bg, foreground=muted,
                            font=("Segoe UI", 9)).pack(anchor="w", padx=18, pady=(4, 13))
          
              def _mode_changed(self, _event=None):
                  provider = self.mode.get()
                  if _event is not None:
                      self.api_key.set("")
                      self.allow_online.set(False)
                  self.model.set(DEFAULT_MODELS.get(provider, ""))
                  self.model_entry.configure(state="normal" if provider != OPTIONS[0] else "disabled")
                  self.key_entry.configure(state="normal" if provider in OPTIONS[1:3] else "disabled")
                  self.privacy.configure(state="normal" if provider in OPTIONS[1:3] else "disabled")
          
              def _chat(self, tag, msg):
                  self.chat.configure(state="normal")
                  self.chat.insert(END, ("Vous : " if tag == "user" else "Assistant : " if tag == "assistant" else "ℹ ") + msg + "\n", tag)
                  self.chat.configure(state="disabled")
                  self.chat.see(END)
          
              def _notify(self, kind, payload):
                  self.events.put((kind, payload))
          
              def _drain(self):
                  try:
                      while True:
                          kind, payload = self.events.get_nowait()
                          if kind == "status":
                              self.status.set(payload)
                          elif kind == "chat":
                              self._chat("assistant", payload)
                          elif kind == "connected":
                              self.rpc = payload
                              self.status.set("Connecté · commandes simples avec confirmation / composition après accord")
                              self._chat("system", "Lemon Studio est connecté. Les commandes individuelles restent soumises à confirmation. Le mode Composition demandera ton accord une seule fois avant de créer le projet.")
                          elif kind == "composer_plan":
                              prompt, cfg, chosen, scanned, roots, choice_note, pack_only, audit = payload
                              self._confirm_compose(prompt, cfg, chosen, scanned, roots, choice_note, pack_only, audit)
                          elif kind == "composer_progress":
                              msg, pct = payload
                              self.status.set(f"Composition : {pct}% — {msg}")
                              self._chat("system", msg)
                          elif kind == "ready":
                              self.pending = False
                              self.submit.configure(state="normal")
                              self.compose_button.configure(state="normal")
                              self.rebalance_button.configure(state="normal")
                  except queue.Empty:
                      pass
                  self.root.after(100, self._drain)
          
              def _launch(self):
                  try:
                      if getattr(sys, "frozen", False):
                          root = Path(sys.executable).resolve().parent
                      else:
                          root = Path(__file__).resolve().parent
                      exe = root / "lemonstudio.exe"
                      if not exe.is_file():
                          raise FileNotFoundError(f"Impossible de trouver lemonstudio.exe dans {root}. Décompresse intégralement l'archive ZIP.")
                      port, token = local_port(), secrets.token_urlsafe(32)
                      self.proc = subprocess.Popen([str(exe), "--control", str(port), "--control-level", "edit",
                                                    "--control-token", token], cwd=str(root))
                      rpc = LemonRpc(port, token)
                      for _ in range(180):
                          if self.proc.poll() is not None:
                              raise RuntimeError("Lemon Studio s'est fermé pendant le démarrage.")
                          try:
                              rpc.call("state")
                              self._notify("connected", rpc)
                              return
                          except (OSError, TimeoutError, ConnectionError):
                              time.sleep(0.25)
                      raise RuntimeError("Lemon Studio n'a pas ouvert son interface de contrôle. Réessaie en fermant les anciennes fenêtres.")
                  except Exception as exc:
                      self._notify("status", "Échec de connexion")
                      self._notify("chat", str(exc))
          
              def _busy_start(self):
                  if self.pending:
                      return False
                  if not self.rpc:
                      self._chat("system", "Lemon Studio n'est pas encore connecté.")
                      return False
                  self.pending = True
                  self.submit.configure(state="disabled")
                  self.compose_button.configure(state="disabled")
                  self.rebalance_button.configure(state="disabled")
                  return True
          
              def _submit(self):
                  value = self.prompt.get("1.0", END).strip()
                  if not value or not self._busy_start():
                      return
                  provider, model, key = self.mode.get(), self.model.get(), self.api_key.get()
                  if provider in OPTIONS[1:3] and not self.allow_online.get():
                      self.pending = False
                      self.submit.configure(state="normal")
                      self.compose_button.configure(state="normal")
                      self.rebalance_button.configure(state="normal")
                      self._chat("system", "Coche la case de consentement avant d'envoyer le résumé du projet à une API externe.")
                      return
                  self.prompt.delete("1.0", END)
                  self._chat("user", value)
                  self.status.set("Analyse de la demande...")
                  def work():
                      try:
                          state = self.rpc.call("state")
                          p = offline_plan(value) if provider == OPTIONS[0] else online_plan(value, state, provider, model, key)
                          msg, cmds = validate_commands(p, state)
                          self._notify("chat", msg)
                          if cmds:
                              self._notify("chat", "Proposition :\n" + "\n".join(" • " + json.dumps(c, ensure_ascii=False)[:350] for c in cmds))
                              result = self.rpc.call("propose", commands=cmds, name="Assistant IA : " + value[:48])
                              self._notify("chat", f"Proposition n° {result.get('proposal')} transmise. Confirme ou refuse les changements dans Lemon Studio.")
                          else:
                              self._notify("chat", "Aucune modification proposée.")
                          self._notify("status", "Prêt · aucun changement sans confirmation")
                      except Exception as exc:
                          self._notify("chat", "Impossible de proposer ces changements : " + str(exc))
                          self._notify("status", "Erreur · tu peux réessayer")
                      finally:
                          self._notify("ready", None)
                  threading.Thread(target=work, daemon=True).start()
          
              def _compose(self):
                  value = self.prompt.get("1.0", END).strip()
                  if not value or not self._busy_start():
                      return
                  if self.mode.get() != OPTIONS[3]:
                      self._chat("system", "Pour composer un morceau complet gratuitement, sélectionne Ollama (sur ce PC).")
                      self._notify("ready", None)
                      return
                  model = self.model.get().strip()
                  pack_only = self.pack_only.get()
                  self._chat("user", value)
                  self.status.set("Analyse de tes packs + préparation musicale Ollama...")
                  def plan_worker():
                      try:
                          roots=composer.discover_pack_roots()
                          if not roots:
                              raise ValueError("Aucun dossier de samples enregistré dans Lemon Studio. Ajoute tes packs au Browser de Lemon Studio puis redémarre l'assistant.")
                          self._notify("chat", f"Recherche dans {len(roots)} dossier(s) de samples enregistrés...")
                          ranked,scanned=composer.find_pack_candidates(roots,value)
                          if not any(ranked.values()):
                              raise ValueError("Des fichiers sont présents mais aucun sample compatible n'a pu être identifié. Vérifie les sous-dossiers et les noms des fichiers (Kick, Snare, Lead...).")
                          if composer.infer_style(value)=='frenchcore' and not ranked.get('kick'):
                              raise ValueError('Aucun kick Frenchcore COMPLET identifié dans tes packs. Les fichiers TOP/PUNCH/TAIL isolés sont exclus : ajoute ou référence un kick complet (Full Kick) pour éviter de créer un drop sans grosse caisse.')
                          current = self.rpc.call("state")
                          raw = composer.plan_from_ollama(value, model, current)
                          cfg = composer.normalize(raw, value)
                          chosen,choice_note,audit=composer.choose_samples_ollama(ranked,value,model,cfg)
                          self._notify("composer_plan", (value,cfg,chosen,scanned,len(roots),choice_note,pack_only,audit))
                      except Exception as exc:
                          self._notify("chat", "Impossible de préparer le morceau : " + str(exc))
                          self._notify("status", "Erreur Ollama · vérifie le modèle installé")
                          self._notify("ready", None)
                  threading.Thread(target=plan_worker, daemon=True).start()
          
              def _confirm_compose(self, prompt, cfg, chosen, scanned, roots, choice_note, pack_only, audit):
                  missing=[r for r in composer.ROLE_ORDER if r not in chosen]
                  names="\n".join(f"- {composer.ROLE_NAMES[role]} : {Path(path).name}" for role,path in chosen.items())
                  explanations="\n".join(
                      f"- {composer.ROLE_NAMES[role]} : {audit.get(role,{}).get('reason','non analysé')}"
                      + (f" | alternative : {audit[role]['alternative']}" if audit.get(role,{}).get('alternative') else '')
                      for role in chosen)
                  ambience_lines=[]
                  for role,filepath in chosen.items():
                      profile=composer.sample_ambience_profile(str(filepath))
                      gap=composer.sample_minimum_gap(role,filepath,cfg['bpm'])
                      if profile['wet']:
                          ambience_lines.append(f"- {composer.ROLE_NAMES[role]} : queue audio potentielle ("
                                                +profile['reason']+f"), espacement minimum ~{gap:.2f}s")
                  tails="\n".join(ambience_lines) or "Aucune queue audio notable identifiée (estimation)."
                  self._chat("system", f"Analyse de {scanned} samples dans {roots} pack(s) · {choice_note}.\n" + names
                             + "\nJUSTIFICATION DU CHOIX :\n" + explanations
                             + "\nPROTECTION REVERB / ECHO :\n"+tails
                             + "\nLes effets intégrés Lemon Studio sont proposés à faible dosage sur sons secs ; "
                               "pas de reverb/delay ajouté sur les samples déjà réverbérés. "
                               "Le moteur ne peut pas supprimer une réverbération enregistrée dans le fichier original."
                             + "\nCes mesures ne garantissent pas une qualité musicale parfaite : écoute et validation humaines nécessaires.")
                  text = (f"Genre / rythme : {cfg.get('style', 'generic')}\n"
                          f"Titre : {cfg['title']}\n" 
                          f"Tempo : {cfg['bpm']} BPM\n"
                          f"Durée cible : ~{cfg['seconds']} secondes ({cfg['bars']} mesures)\n\n"
                          f"{scanned} fichiers explorés dans {roots} dossier(s).\n"
                          f"Sélection : {choice_note}\n\n{names}\n\n"
                          + ("Rôles non identifiés, omis (mode packs uniquement) : " +
                              ", ".join(composer.ROLE_NAMES[r] for r in missing) + "\n\n" if pack_only and missing else "")
                          + (("Reggae roots : One Drop strict, skank, orgue bubble. " if cfg.get('groove')=='one_drop' else
                              "Reggae disco : backbeat dansant, basse syncopee, skank en contretemps. ")
                             if cfg.get('style') == 'reggae' else
                             "Arrangement V0.13 : teaser avec entrée progressive des instruments, trois themes (drop A/B et break), progression harmonique, silences et couches évolutives. ")
                          + ("V0.13 : les TOP/PUNCH/TAIL seuls ne servent plus de kick complet. Les boucles étiquetées à un BPM incompatible sont exclues quand détectables. Les WAV compatibles sont évalués sur leurs graves, aigus, transitoires et durée ; "
                             "l'association des instruments est optimisée avant validation. Les formats non décodés sont moins fiables.\n\n"
                             "Mix : master à son niveau unity, gain moins atténué, contrôle des longues superpositions WAV, "
                             "transpositions MIDI limitées et accords samples moins superposés. "
                             "Les samples à réverbération/écho sont espacés davantage et ne reçoivent PAS de reverb/delay supplémentaire ; pour les samples secs, des effets Lemon Studio sont ajoutés à faible dosage quand disponibles. Ce n'est pas un mastering ; surveille le vumètre.\n\n"
                             "Attention : les sons des packs sont chargés tels quels. Un lead ou une basse peut être mal accordé ; "
                             "la sélection repose sur les noms et des mesures audio approximatives, pas une écoute IA complète.\n\n"
                             "Les fichiers du pack resteront intacts. Les modifications du projet sont annulables. "
                             "Le projet n'est pas enregistré automatiquement.\n\n"
                             "V0.13 : queues de reverb/echo espacées, plugins EQ / delay / reverb ajoutés "
                             "quand disponibles, sans réglage avancé garanti des paramètres internes.\n\n"
                             "Autoriser la création du morceau ?"))
                  if not messagebox.askyesno("Autoriser la composition automatique", text, parent=self.root):
                      self._chat("system", "Composition annulée. Aucun changement effectué.")
                      self._notify("ready", None)
                      return
                  self.prompt.delete("1.0", END)
                  self._chat("assistant", f"Composition acceptée : {cfg['title']}, {cfg['bpm']} BPM, {cfg['bars']} mesures. Création automatique en cours...")
                  def work():
                      try:
                          result = composer.build_song(self.rpc, cfg,
                                    lambda msg,pct: self._notify("composer_progress",(msg,pct)),
                                    chosen_samples=chosen,pack_only=pack_only)
                          used=" ; ".join(composer.ROLE_NAMES[r] + " : " + Path(p).name for r,p in result['chosen_samples'].items())
                          self._notify("chat", f"Morceau créé : {result['patterns']} patterns, {result['notes']} notes, "
                                               f"{result['bars']} mesures. Effets : "
                                               + (", ".join(e['role']+"="+e['effect'] for e in result.get('effects',[])) or "aucun effet supplémentaire")
                                               + f" ; déclenchements chevauchants évités : {result.get('overlaps_avoided',0)}. Samples : {used}. "
                                               "Ouvre la Playlist et enregistre une COPIE du projet.")
                          self._notify("status", "Composition terminée · projet non sauvegardé")
                      except Exception as exc:
                          self._notify("chat", "La composition a échoué : " + str(exc))
                          self._notify("status", "Échec de composition · consulte le journal")
                      finally:
                          self._notify("ready", None)
                  threading.Thread(target=work, daemon=True).start()
          
              def _rebalance(self):
                  if not self._busy_start():
                      return
                  try:
                      detected=composer.composer_channel_roles(self.rpc.call('state'))
                      if not detected:
                          raise ValueError("Aucun canal de l'ancien compositeur trouvé dans le projet ouvert.")
                      yes=messagebox.askyesno('Rééquilibrer volume — V0.13',
                          f"{len(detected)} canal(aux) de l'assistant détectés.\n"
                          'Le volume master sera remis au niveau normal (unity), et les volumes de ces canaux seront rééquilibrés.\n\n'
                          'Cela peut devenir plus fort : commence à faible volume de tes enceintes / casque et vérifie le vumètre.\n\n'
                          'Les autres pistes et les samples ne seront pas modifiés. Action annulable. Continuer ?',parent=self.root)
                      if not yes:
                          self._chat('system','Rééquilibrage annulé, aucune modification.')
                          self._notify('ready',None)
                          return
                  except Exception as exc:
                      self._chat('system',str(exc))
                      self._notify('ready',None)
                      return
                  def worker():
                      try:
                          count=composer.rebalance_project(self.rpc)
                          self._notify('chat',f'{count} canaux rééquilibrés. Teste à faible volume, surveille le master et sauvegarde une COPIE du projet.')
                          self._notify('status','Rééquilibrage terminé · projet non sauvegardé')
                      except Exception as exc:
                          self._notify('chat','Rééquilibrage impossible : '+str(exc))
                      finally:
                          self._notify('ready',None)
                  threading.Thread(target=worker,daemon=True).start()
          
              def _refresh_state(self):
                  if not self._busy_start():
                      return
                  def work():
                      try:
                          s = self.rpc.call("state")
                          self._notify("chat", f"Projet actuel : {s.get('tempo')} BPM · {len(s.get('channels',[]))} canaux · {len(s.get('patterns',[]))} patterns.")
                      except Exception as exc:
                          self._notify("chat", "Impossible de lire le projet : " + str(exc))
                      finally:
                          self._notify("ready", None)
                  threading.Thread(target=work, daemon=True).start()
          
              def _close(self):
                  # We deliberately do not terminate Lemon Studio: closing the AI shouldn't lose DAW work.
                  self.root.destroy()
          
              def run(self):
                  self.root.mainloop()
          
          
          def run_self_tests():
              sample = {"ppq": 96, "channels": [{"id": 7, "name": "Sampler"}], "patterns": [{"id": 21, "name": "Intro"}]}
              assert offline_plan("Mets le tempo à 200 BPM")["commands"] == [{"op": "set_tempo", "bpm": 200}]
              assert offline_plan("ajoute un canal Kick")["commands"][0]["op"] == "add_channel"
              assert offline_plan("crée un pattern Intro")["commands"][0]["op"] == "add_pattern"
              assert validate_commands({"commands": [{"op": "add_notes", "pattern": 21, "notes": [{"channel": 7, "position": 0, "length": 96, "key": 60}]}]}, sample)[1][0]["notes"][0]["velocity"] == 100
              for malicious in [{"op": "delete_channel", "channel": 7}, {"op": "add_notes", "pattern": 22, "notes": [{"channel": 7, "position": 0, "length": 96, "key": 60}]}]:
                  try:
                      validate_commands({"commands": [malicious]}, sample)
                      raise AssertionError("Unsafe command accepted")
                  except ValueError:
                      pass
              assert parse_json_answer('```json\n{"message":"ok","commands":[]}\n```')["message"] == "ok"
              composer.self_test()
              print("Lemon Studio AI Composer V0.13: self-tests OK")
          
          
          if __name__ == "__main__":
              if "--self-test" in sys.argv:
                  run_self_tests()
              else:
                  AssistantApp().run()
          '@ | Set-Content -LiteralPath lemon_ai_composer.py -Encoding utf8
          python -m py_compile lemon_composer_core.py lemon_ai_composer.py
          if ($LASTEXITCODE -ne 0) { throw 'Erreur de syntaxe Python' }
          python lemon_ai_composer.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Echec des tests du compositeur IA' }
      - name: Compiler l assistant Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { throw 'Installation PyInstaller echouee' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Lemon-Studio-Compositeur-Musical-IA lemon_ai_composer.py
          if ($LASTEXITCODE -ne 0) { throw 'Compilation PyInstaller echouee' }
          if (-not (Test-Path 'dist\Lemon-Studio-Compositeur-Musical-IA.exe')) { throw 'Executable IA introuvable' }
          if (-not (Test-Path 'Lemon-Studio-FR-Musical-V13\lemonstudio.exe')) { throw 'Lemon Studio FR introuvable' }
          Copy-Item 'dist\Lemon-Studio-Compositeur-Musical-IA.exe' 'Lemon-Studio-FR-Musical-V13\Lemon-Studio-Compositeur-Musical-IA.exe'
          Copy-Item 'lemon_ai_composer.py' 'Lemon-Studio-FR-Musical-V13\lemon_ai_composer.py'
          Copy-Item 'lemon_composer_core.py' 'Lemon-Studio-FR-Musical-V13\lemon_composer_core.py'
          @'
          LEMON STUDIO FR - MOTEUR MUSICAL IA V0.13 EXPERIMENTAL

          1. Decompresser entierement le ZIP dans un nouveau dossier Windows.
          2. Fermer les anciennes versions de Lemon Studio.
          3. Lancer Lemon-Studio-Compositeur-Musical-IA.exe (pas lemonstudio.exe).
          4. Choisir Ollama avec qwen2.5:7b-instruct.
          5. Activer Mes packs uniquement, puis Composer un morceau (1 prompt).
          6. Consulter la liste des samples selectionnes et les JUSTIFICATIONS.
          7. Autoriser la creation apres controle des sons proposes.
          8. Ecouter d'abord a faible volume, surveiller le master, enregistrer
             une COPIE du projet, puis exporter un WAV.

          NOUVEAU V0.13 - Effets et reverb/echo :
          * Détection prudente des queues audio à partir de quelques mesures
            PCM16 WAV et des noms de fichiers. Pas de séparation de reverb.
          * Espacement des sons mélodiques et des samples dont la queue se
            poursuit, y compris entre la fin et le début de deux sections.
          * Effets intégrés disponibles seulement : Lemon Parametric EQ,
            Lemon Delay, Lemon Reverb. Ambiances à 4-8% de mix, sur sons secs.
          * Aucune reverb ni delay supplémentaire sur les sons classés WET.
          * Plugins internes facultatifs : si la piste ou le plugin ne peut
            être identifié, on continue sans effet ; pas de master garanti.
          * Compte rendu de l'assistant : samples WET, effets ajoutés,
            déclenchements evitables, avertissements.

          Fonctions reprises V0.10 - Selection coherente des samples :
          * Un TOP/PUNCH/TAIL seul ne remplace plus un kick Frenchcore complet.
          * Les sources melodiq. de tempo incompatible sont ecartees
            lorsque leur duree ou leur nom indique une phrase audio.
          * Etiquettes de notes (par ex. BASS_10_F) reconnues : Fa est
            une note valide en Re mineur, mais lecture non auto-accordee.
          * Le plan de composition et la selection Qwen retentent une fois
            en cas de JSON invalide. Retour d erreur plus informatif.
          * Les listes de candidats explorent davantage de sous-dossiers.
          * AUCUNE modification des WAV originaux, pas de master garanti.

          Fonctions reprises de V0.9 :
          * Liste etendue jusqu'a 16 candidats par role musical.
          * Analyse approx. PCM WAV (8/16/24/32 bits) : grave/aigu,
            envelope temporelle, duree, crete, dynamique et stereo.
          * Optimisation des associations, surtout kick+basse, et controle
            de tonalite selon les ETIQUETTES des fichiers.
          * Qwen conseille, mais ne choisit pas unilateralement un son qui
            obtient une mauvaise compatibilite numerique.
          * Compte rendu dans la fenetre, avec les raisons et alternatives.
          * Fichiers des packs lus uniquement, jamais modifies.

          LIMITES : ce n'est PAS une oreille humaine ni un modele de
          reconnaissance musicale audio. FLAC, MP3 et AIFF peuvent etre
          choisis sur leurs noms mais sans analyse sonore par ce moteur.
          Les WAV float non pris en charge restent aussi non analyses.
          Pas de garantie de son professionnel ou de mix sans saturation ;
          ni limiteur ni mastering automatique. Les effets ne retirent pas
