          def clean(text: str) -> str:
              return "".join(c for c in unicodedata.normalize("NFKD", text.lower()) if not unicodedata.combining(c))
          
          
          def offline_plan(text: str) -> dict:
              """Small deterministic command subset, no AI or Internet required."""
              t = clean(text)
              commands: list[dict] = []
              bpm = re.search(r"\b(\d{2,3})\s*bpm\b", t)
              if not bpm:
                  bpm = re.search(r"\b(?:tempo|bpm)\s*(?:a|de|sur|=|:)?\s*(\d{2,3})\b", t)
              if bpm:
                  value = int(bpm.group(1))
                  if not 10 <= value <= 522:
                      raise ValueError("Le tempo doit être compris entre 10 et 522 BPM.")
                  commands.append({"op": "set_tempo", "bpm": value})
          
              if re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?(?:piste\s+(?:de\s+)?mixeur|piste\s+mixer|insert\s+mixeur)\b", t):
                  commands.append({"op": "add_track"})
          
              pattern_match = re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?(?:pattern|motif)\s*(?:nomme|appele|:)?\s*([\w -]{0,42})", t)
              if pattern_match:
                  name = pattern_match.group(1).strip(" .,-")
                  commands.append({"op": "add_pattern", **({"name": name.title()} if name else {})})
          
              chan = re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?(?:canal|channel|instrument)\s*(?:nomme|appele|:)?\s*([\w -]{0,42})", t)
              if chan:
                  name = chan.group(1).strip(" .,-")
                  commands.append({"op": "add_channel", **({"name": name.title()} if name else {})})
              elif re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?kick\b", t):
                  commands.append({"op": "add_channel", "name": "Kick"})
          
              title = re.search(r"\b(?:nomme|renomme|appelle)\s+(?:le\s+)?projet\s+(.{1,64})", text, re.IGNORECASE)
              if title:
                  commands.append({"op": "set_info", "title": title.group(1).strip(" \"'.,")})
          
              if not commands:
                  return {"message": "Mode local : je comprends actuellement le BPM, l'ajout de canaux, de pistes du mixeur, de patterns et le nom du projet. Pour créer des notes ou des arrangements à partir d'une description libre, choisis ChatGPT, Claude ou Ollama.", "commands": []}
              return {"message": "Voici les modifications que je peux proposer sans connexion IA. Un nouveau canal Sampler ne produit pas de son tant que tu ne charges pas de sample.", "commands": commands[:8]}
          
          
          def parse_json_answer(raw: str) -> dict:
              if not isinstance(raw, str):
                  raise ValueError("L'IA n'a pas retourné de texte.")
              stripped = raw.strip()
              start = stripped.find("{")
              if start < 0:
                  raise ValueError("La réponse de l'IA ne contient pas de JSON exploitable.")
              try:
                  obj, _ = json.JSONDecoder().raw_decode(stripped[start:])
              except json.JSONDecodeError as e:
                  raise ValueError("La réponse de l'IA n'est pas un JSON valide.") from e
              if not isinstance(obj, dict):
                  raise ValueError("Réponse IA incorrecte : objet attendu.")
              return obj
          
          
          def _short_str(x, limit=80):
              if not isinstance(x, str) or not x.strip() or len(x) > limit or "\x00" in x or "\n" in x:
                  raise ValueError("Nom ou valeur de texte invalide.")
              return x.strip()
          
          
          def _int(x, mini, maxi):
              if type(x) is not int or not mini <= x <= maxi:
                  raise ValueError(f"Entier requis entre {mini} et {maxi}.")
              return x
          
          
          def _float(x, mini, maxi):
              if isinstance(x, bool) or not isinstance(x, (int, float)) or not mini <= float(x) <= maxi:
                  raise ValueError(f"Nombre requis entre {mini} et {maxi}.")
              return float(x)
          
          
          def validate_commands(plan: dict, state: dict) -> tuple[str, list[dict]]:
              """Hard allowlist. Never pass arbitrary model-generated operations to Lemon Studio."""
              msg = str(plan.get("message", "Proposition de modifications."))[:1200]
              items = plan.get("commands", [])
              if not isinstance(items, list) or len(items) > 8:
                  raise ValueError("L'assistant doit proposer au maximum huit commandes.")
              channel_ids = {int(c["id"]) for c in state.get("channels", []) if isinstance(c, dict) and type(c.get("id")) is int}
              pattern_ids = {int(p["id"]) for p in state.get("patterns", []) if isinstance(p, dict) and type(p.get("id")) is int}
              ppq = int(state.get("ppq") or 96)
              result = []
              for item in items:
                  if not isinstance(item, dict):
                      raise ValueError("Commande non valide.")
                  op = item.get("op")
                  if op == "set_tempo" and set(item) == {"op", "bpm"}:
                      result.append({"op": op, "bpm": _float(item["bpm"], 10, 522)})
                  elif op == "set_swing" and set(item) == {"op", "swing"}:
                      result.append({"op": op, "swing": _float(item["swing"], 0, 1)})
                  elif op == "set_time_signature" and set(item) == {"op", "numerator", "denominator"}:
                      num = _int(item["numerator"], 1, 32)
                      den = _int(item["denominator"], 2, 16)
                      if den not in (2, 4, 8, 16):
                          raise ValueError("Dénominateur invalide.")
                      result.append({"op": op, "numerator": num, "denominator": den})
                  elif op in ("add_channel", "add_pattern") and set(item) <= {"op", "name"}:
                      result.append({"op": op, **({"name": _short_str(item["name"], 64)} if "name" in item else {})})
                  elif op == "add_track" and set(item) == {"op"}:
                      result.append({"op": op})
                  elif op == "set_info" and set(item) == {"op", "title"}:
                      result.append({"op": op, "title": _short_str(item["title"], 110)})
                  elif op == "add_notes" and set(item) == {"op", "pattern", "notes"}:
                      pid = _int(item["pattern"], 1, 2**32 - 1)
                      if pid not in pattern_ids:
                          raise ValueError("Le pattern indiqué par l'IA n'existe pas encore.")
                      notes = item["notes"]
                      if not isinstance(notes, list) or not 1 <= len(notes) <= 64:
                          raise ValueError("Ajoute entre 1 et 64 notes par commande.")
                      clean_notes = []
                      for note in notes:
                          if not isinstance(note, dict) or set(note) - {"channel", "position", "length", "key", "velocity", "pan"}:
                              raise ValueError("Champs de note invalides.")
                          if not {"channel", "position", "length", "key"} <= set(note):
                              raise ValueError("La note doit indiquer channel, position, length et key.")
                          cid = _int(note["channel"], 1, 2**32 - 1)
                          if cid not in channel_ids:
                              raise ValueError("Le canal indiqué par l'IA n'existe pas encore.")
                          n = {"channel": cid, "position": _int(note["position"], 0, ppq * 256),
                               "length": _int(note["length"], 1, ppq * 16), "key": _int(note["key"], 0, 127),
                               "velocity": _int(note.get("velocity", 100), 1, 128), "pan": _int(note.get("pan", 64), 0, 128)}
                          clean_notes.append(n)
                      result.append({"op": op, "pattern": pid, "notes": clean_notes})
                  else:
                      raise ValueError(f"Commande non autorisée ou paramètres invalides : {op!r}.")
              return msg, result
          
          
          def project_summary(state: dict) -> dict:
              return {"tempo": state.get("tempo"), "ppq": state.get("ppq"),
                      "channels": [{"id": c.get("id"), "name": c.get("name"), "kind": c.get("kind")} for c in state.get("channels", [])[:20]],
                      "patterns": [{"id": p.get("id"), "name": p.get("name"), "notes": p.get("notes")} for p in state.get("patterns", [])[:20]],
                      "mixer": [{"id": m.get("id"), "name": m.get("name")} for m in state.get("mixer", [])[:15]]}
          
          
          def api_post(url: str, headers: dict, payload: dict) -> dict:
              req = urllib.request.Request(url, data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                                           headers={"Content-Type": "application/json", **headers}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=55) as response:
                      return json.loads(response.read(2_000_000).decode("utf-8"))
              except urllib.error.HTTPError as e:
                  msg = e.read(2048).decode("utf-8", "replace")
                  raise RuntimeError(f"Erreur API HTTP {e.code} : {msg[:500]}") from None
              except urllib.error.URLError as e:
                  raise RuntimeError(f"Connexion au fournisseur IA impossible : {e.reason}") from None
          
          
          def online_plan(text: str, state: dict, provider: str, model: str, api_key: str) -> dict:
              payload = json.dumps({"demande": text[:1500], "etat_du_projet": project_summary(state)}, ensure_ascii=False)
              model = _short_str(model, 120)
              if provider == OPTIONS[1]:
                  if not api_key.strip():
                      raise ValueError("Saisis ta clé API OpenAI (ton abonnement ChatGPT ne suffit pas).")
                  response = api_post("https://api.openai.com/v1/responses", {"Authorization": "Bearer " + api_key.strip()},
                                      {"model": model, "instructions": SYSTEM_PROMPT, "input": payload, "max_output_tokens": 1500})
                  output_text = response.get("output_text", "")
                  if not output_text:
                      output_text = "\n".join(content.get("text", "") for out in response.get("output", [])
                                              for content in out.get("content", []) if content.get("type") == "output_text")
                  return parse_json_answer(output_text)
              if provider == OPTIONS[2]:
                  if not api_key.strip():
                      raise ValueError("Saisis ta clé API Anthropic (ton abonnement Claude ne suffit pas).")
                  response = api_post("https://api.anthropic.com/v1/messages",
                                      {"x-api-key": api_key.strip(), "anthropic-version": "2023-06-01"},
                                      {"model": model, "max_tokens": 1500, "system": SYSTEM_PROMPT,
                                       "messages": [{"role": "user", "content": payload}]})
                  output_text = "\n".join(c.get("text", "") for c in response.get("content", []) if c.get("type") == "text")
                  return parse_json_answer(output_text)
              if provider == OPTIONS[3]:
                  response = api_post("http://127.0.0.1:11434/api/generate", {},
                                      {"model": model, "prompt": SYSTEM_PROMPT + "\n" + payload, "stream": False})
                  return parse_json_answer(response.get("response", ""))
              return offline_plan(text)
          
          
          class LemonRpc:
              def __init__(self, port: int, token: str):
                  self.port = port
                  self.token = token
          
              def call(self, method: str, **params):
                  # Per-request connections are intentional: no shared socket across Tk workers.
                  with socket.create_connection(("127.0.0.1", self.port), timeout=6) as conn:
                      conn.settimeout(12)
                      f = conn.makefile("r", encoding="utf-8")
                      def send(name, data):
                          data = json.dumps({"jsonrpc": "2.0", "id": 1 if name == "hello" else 2,
                                             "method": name, "params": data}, ensure_ascii=False) + "\n"
                          conn.sendall(data.encode("utf-8"))
                          line = f.readline()
                          if not line:
                              raise ConnectionError("Lemon Studio a fermé la connexion.")
                          out = json.loads(line)
                          if "error" in out:
                              raise RuntimeError("Lemon Studio : " + out["error"].get("message", "Erreur inconnue"))
                          return out.get("result")
                      send("hello", {"name": "Assistant IA FR", "token": self.token})
                      return send(method, params)
          
          
          def local_port() -> int:
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  return s.getsockname()[1]
          
          
