          def test_ambience_and_plugins_v11():
              from array import array
              with tempfile.TemporaryDirectory() as td:
                  base=Path(td); sample=base/'Pad_Echo.wav';dry=base/'Lead_Dry.wav'
                  def synth(path,tail=False):
                      with wave.open(str(path),'wb') as w:
                          w.setnchannels(1);w.setsampwidth(2);w.setframerate(12000)
                          values=array('h')
                          for i in range(12000*2):
                              amp=math.exp(-i/12000*(1.4 if tail else 6))
                              values.append(int(12000*amp*math.sin(i*.05)))
                          w.writeframes(values.tobytes())
                  synth(sample,tail=True);synth(dry,tail=False)
                  assert sample_ambience_profile(str(sample))['wet']
                  assert not sample_ambience_profile(str(dry))['wet']
                  assert sample_minimum_gap('pad',sample,200)>.8
                  ticks=[note(10,k*96,24,60) for k in range(6)]
                  guarded,removed=_suppress_ambience_overlap(ticks,'pad',sample,200,96,0,{})
                  assert removed>0 and 0<len(guarded)<len(ticks)
                  last={};left,_=_suppress_ambience_overlap([note(10,0,24,60)],'pad',sample,200,96,0,last)
                  right,dropped=_suppress_ambience_overlap([note(10,0,24,60)],'pad',sample,200,96,96,last)
                  assert len(left)==1 and not right and dropped==1  # section boundary
                  available=['Lemon Parametric EQ','Lemon Reverb','Lemon Delay']
                  plan=plan_effects({'pad':sample,'lead':dry},available)
                  assert all(x[0]!='Lemon Reverb' for x in plan['pad'])
                  assert plan.get('lead') and all(x[0]!='Lemon Delay' for x in plan['lead'])
                  # Host RPC simulation with distinct mixer tracks and effect slots.
                  class Host:
                      def __init__(self):self.cmd=[]
                      def call(self,method,**params):
                          if method=='plugins':return {'effects':available}
                          if method=='state':return {'channels':[{'id':101,'track':201},{'id':102,'track':202}],
                               'mixer':[{'id':201,'number':1,'slots':[]},{'id':202,'number':2,'slots':[]}]}
                          if method=='apply':
                              self.cmd+=params['commands']
                              return {'results':[{'slot':300+k} if c['op']=='add_effect' else None
                                                 for k,c in enumerate(params['commands'])]}
                          raise AssertionError(method)
                  h=Host();steps=[];msgs=[]
                  fx=apply_builtin_effects(h,{'pad':101,'lead':102},{'pad':sample,'lead':dry},steps,lambda a,b:msgs.append(a))
                  assert fx and not msgs and len(fx)>=2
                  assert all(e['effect']!='Lemon Reverb' for e in fx if e['role']=='pad')
                  assert all(e['effect']!='Lemon Delay' for e in fx)
                  assert all(cmd['op'] in ('add_effect','set_slot') for cmd in h.cmd)
                  assert all(0<=c.get('mix',0)<=1 for c in h.cmd)
              print('V0.11: queues audio, espacement et plugins internes : OK')
          
          
          
          
