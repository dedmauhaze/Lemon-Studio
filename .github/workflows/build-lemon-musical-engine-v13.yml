name: Lemon Studio FR + Moteur Musical IA V0.13 - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lemon-musical-engine-v13.yml'

permissions:
  contents: read
  actions: read

jobs:
  musical-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Recuperer Lemon Studio FR valide
        uses: actions/download-artifact@v4
        with:
          name: Lemon-Studio-Windows-x64-FR
          run-id: 41723186509
          github-token: ${{ github.token }}
          repository: dedmauhaze/Lemon-Studio
          path: Lemon-Studio-FR-Musical-V13
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generer et tester le moteur musical V0.13
        shell: pwsh
        run: |
          @'
          # -*- coding: utf-8 -*-
          """Lemon Composer: local Ollama musical direction + deterministic, undoable Lemon Studio build.
          No third-party Python dependencies. GPL-3.0-or-later; experimental, independent companion.
          """
          from __future__ import annotations
          import json
          import math
          import os
          from pathlib import Path
          import random
          import re
          import struct
          import urllib.error
          import urllib.request
          import wave
          import unicodedata
          import tempfile
          import hashlib
          from functools import lru_cache
          
          ROLE_ORDER = ("kick", "snare", "hat", "bass", "lead", "pad", "arp")
          ROLE_NAMES = {"kick":"Kick", "snare":"Snare", "hat":"Hi-hat", "bass":"Basse", "lead":"Lead", "pad":"Accords", "arp":"Arpege"}
          TONICS = {"C":0, "C#":1, "DB":1, "D":2, "D#":3, "EB":3, "E":4, "F":5, "F#":6, "GB":6, "G":7, "G#":8, "AB":8, "A":9, "A#":10, "BB":10, "B":11}
          SCALE = {"minor":[0,2,3,5,7,8,10], "major":[0,2,4,5,7,9,11]}
          MAX_BARS = 160
          
          # Automatic read-only discovery of folders already registered in Lemon Studio's Browser.
          # V0.10: verify the PURPOSE of each sample before comparing combinations.
          # Objective filtering is not an artistic judgement or pitch analysis.
          SAMPLE_EXTENSIONS = {'.wav', '.aif', '.aiff', '.flac', '.ogg', '.mp3'}
          ROLE_TERMS = {
              'kick': {'kick': 48, 'kicks': 45, 'bassdrum': 37, 'bd': 19, 'tok': 8},
              'snare': {'snare': 46, 'snares': 44, 'clap': 34, 'rimshot': 22, 'rim': 15},
              'hat': {'hihat': 48, 'hats': 43, 'hat': 42, 'cymbal': 25, 'shaker': 22, 'ride': 15},
              'bass': {'reese': 42, 'bass': 38, 'sub': 27, 'rumble': 20, 'acid': 27, '808': 19},
              'lead': {'lead': 44, 'leads': 42, 'supersaw': 40, 'saw': 22, 'melody': 27, 'melodie': 27, 'piano': 33, 'pluck': 28},
              'pad': {'pad': 44, 'pads': 42, 'strings': 31, 'choir': 32, 'texture': 19, 'atmosphere': 29, 'chords': 34, 'chord': 32, 'skank': 53, 'guitar': 34, 'guitare': 34, 'rhythm': 25},
              'arp': {'arp': 43, 'arpeggio': 46, 'arpeggiator': 37, 'pluck': 26, 'sequence': 19, 'organ': 45, 'orgue': 45, 'bubble': 52},
          }
          BAD_TOKENS = {'loop', 'loops', 'demo', 'preview', 'construction', 'song', 'track', 'mixdown', 'mix', 'vocal', 'voice'}
          PERCUSSIVE = ('kick', 'snare', 'hat')
          
          # V0.12: A category is not a musical role. In particular an organ is not
          # automatically an arpeggio, and an aggressive raw lead need not be a melodic
          # hook. Selection remains conservative: no false claim of perceptual listening.
          FRENCHCORE_ARP_HINTS = {'arp','arps','arpeggio','arpeggiator','pluck','plucky','plucked'}
          ARP_PHRASE_TAGS = {'loop','riff','phrase','sequence','sequencer','construction','melody','chord','chords'}
          HARSH_LEAD_HINTS = {'agressive','aggressive','screech','screeches','industrial','noisy','noise','harsh'}
          MELODIC_LEAD_HINTS = {'melodic','melodique','melody','euphoric','euphorique','emotional','emotionnel',
                                'anthem','uplifting','epic','cinematic','supersaw','bright','saw','piano','lead','leads'}
          
          def _melodic_request(prompt):
              t=_fold_label(str(prompt))
              return any(w in t for w in ('melod','epique','emotion','euphor','cinemat','harmoni'))
          
          def _fit_melodic_role(path,role,prompt):
              """Pre-selection role gate, not a subjective sound-quality score."""
              name=_tokens(Path(path).stem)
              folder=_tokens(Path(path).parent.name)
              style=infer_style(prompt)
              if role=='arp' and style=='frenchcore':
                  # CH = chord in many commercial packs. Church organ should NOT become
                  # an arp simply because the old keyword table gave organ 45 points.
                  if (name & {'church','organ','orgue','bubble','choir','chords','chord','pad'} or
                          name & {'ch'} and not name & FRENCHCORE_ARP_HINTS):
                      return False
                  if name & ARP_PHRASE_TAGS and not name & FRENCHCORE_ARP_HINTS:
                      return False
                  if not (name | folder) & FRENCHCORE_ARP_HINTS:
                      return False
              if role=='lead' and style=='frenchcore' and _melodic_request(prompt):
                  if name & {'organ','orgue','church','bass','reese','acid','kick','snare','pad','chord','chords','ambient'}:
                      return False
                  if name & HARSH_LEAD_HINTS and not name & {'melodic','melodique','euphoric','euphorique'}:
                      return False
              return True
          
          
          # V0.6: Use usable *monitoring* levels, not the V0.5 double attenuation.
          # 0.8 is Lemon Studio's master unity, 0.78125 is channel unity.
          # These remain conservative initial mix values, NOT loudness normalization.
          CHANNEL_ATTENUATION_DB = {
              'kick': -2.0, 'snare': -6.0, 'hat': -8.0,
              'bass': -5.0, 'lead': -6.0, 'pad': -9.0, 'arp': -8.0,
          }
          MASTER_ATTENUATION_DB = 0.0
          
          def _seed_for(cfg, part='', section=0):
              """Stable seed derived from request + musical plan (unlike built-in hash())."""
              data = str(cfg.get('seed', 0)) + ':' + str(part) + ':' + str(section)
              return int.from_bytes(hashlib.sha256(data.encode('utf-8')).digest()[:8], 'little')
          
          
          def _velocity_curve(velocity, bar_index, style='frenchcore'):
              """Small phrase accents and breathing, never destructive or sample processing."""
              four = (0, -2, 1, 3)[bar_index % 4]
              return max(1, min(128, int(velocity + four)))
          
          
          def _sample_audio_gain(role, path, cfg):
              """Conservative, bounded gain estimate using a short decoded WAV window.
          
              This is not LUFS analysis or a true peak limiter. Unreadable formats
              retain the V0.6 levels. No source audio is written.
              """
              start = CHANNEL_ATTENUATION_DB[role]
              info = _wav_data(Path(path)) if path and Path(path).is_file() else None
              if not info or 'rms' not in info or 'peak' not in info:
                  return start
              rms = float(info['rms'])
              peak = float(info['peak'])
              if rms <= 0.0005 or peak <= 0.001:
                  return start
              # No real rendered-bus meter is available over the current Lemon Studio RPC.
              # Avoid a systematic -3 dB reduction of every normalized professional sample.
              # Adjust gently to the short-window RMS; never claim LUFS/true-peak normalization.
              target = {'kick': .27, 'snare': .16, 'hat': .12,
                        'bass': .19, 'lead': .16, 'pad': .13, 'arp': .12}[role]
              correction = max(-0.6, min(1.2, 20.*math.log10(target / rms)))
              if peak > .99:
                  correction = min(correction, 0.0)
              return max(-12., min(0., start + correction))
          
          
          def _gain_from_db(db, unity):
              return round(unity * 10 ** (db / 20.0), 6)
          
          # V0.11: Samples with built-in ambience are not dry one-shots. An MIDI note-off
          # is not a promise that a sampler will stop rendering its internal echo tail.
          AMBIENCE_TAGS = {'reverb','verb','echo','delay','wet','room','hall','ambience','ambient','space','tail'}
          
          @lru_cache(maxsize=128)
          def sample_ambience_profile(path):
              """Conservative read-only estimate; NOT reverb source separation.
          
              Files marked reverb/echo are considered wet. For other PCM16 WAVs, sample
              the early and late RMS envelope to identify an audible end-of-file tail.
              Float WAV and compressed audio receive filename/duration heuristics only.
              """
              p=Path(path)
              label=bool(_tokens(p.stem) & AMBIENCE_TAGS)
              data=_wav_data(p) if p.is_file() else None
              dur=float((data or {}).get('duration') or 0)
              ratio=None
              if dur>=0.55 and p.suffix.lower()=='.wav':
                  try:
                      with wave.open(str(p),'rb') as w:
                          rate=w.getframerate();width=w.getsampwidth();channels=w.getnchannels();frames=w.getnframes()
                          if width==2 and channels in (1,2) and rate>=8000 and frames>0:
                              from array import array
                              # 25ms windows from distinct temporal parts; leave sample untouched.
                              def rms(start_s,window=.025):
                                  idx=min(frames-1,max(0,int(start_s*rate)))
                                  w.setpos(idx)
                                  raw=w.readframes(min(int(rate*window),frames-idx))
                                  values=array('h');values.frombytes(raw)
                                  if os.sys.byteorder!='little':values.byteswap()
                                  return math.sqrt(sum(float(a)*a for a in values)/len(values))/32768 if values else 0.
                              early=max(rms(dur*f) for f in (.06,.14,.22,.35))
                              late=max(rms(max(0,dur-f)) for f in (.35,.23,.12))
                              ratio=late/max(early,0.00001)
                  except (OSError,ValueError,wave.Error,EOFError,TypeError):
                      pass
              # A long sample with a measurable tail is at risk of overlap, whether the
              # tail is a reverb or a sustained note. Do not claim it *is* reverb.
              active_tail=bool(dur>=.75 and ratio is not None and ratio>.04)
              wet=label or active_tail
              return {'duration':dur,'wet':wet,'label':label,'tail_ratio':ratio,
                      'reason':('mention reverb/echo dans le fichier' if label else
                                'signal encore audible en fin de sample' if active_tail else
                                'pas de queue longue détectée (estimation)')}
          
          
          def sample_minimum_gap(role,path,bpm):
              """Minimum gap between retriggers; long wet samples should not pile up.
          
              Kick and bass can intentionally overlap in some hard-dance styles, so this
              guard is for repeated triggers of the SAME melodic/percussive sample only.
              """
              profile=sample_ambience_profile(str(path))
              dur=profile['duration']; wet=profile['wet']
              if role in ('lead','pad','arp'):
                  if wet and dur>=.55:return min(2.4,max(.35,dur*.78))
                  if dur>=.9:return min(1.25,max(.30,dur*.5))
              if role=='bass' and wet and dur>=.8:return min(1.25,max(.28,dur*.55))
              if role in ('snare','hat') and wet and dur>.55:
                  return min(.8,max(.24,dur*.5))
              return 0.0
          
          
          def _suppress_ambience_overlap(notes, role, path, bpm, ppq, global_start, last_trigger):
              """Protect crossings between sections as well as notes inside a pattern."""
              gap=sample_minimum_gap(role,path,bpm)
              if not gap:return notes,0
              minimum=max(1,int(round(gap*bpm*ppq/60.)))
              previous=last_trigger.get(role,-10**14)
              output=[];removed=0
              for n in sorted(notes,key=lambda v:(v['position'],v['key'])):
                  at=int(global_start)+int(n['position'])
                  if at-previous<minimum:
                      removed+=1
                      continue
                  output.append(n);previous=at
              if output:last_trigger[role]=previous
              return output,removed
          
          
          def plan_effects(roles_to_samples,available):
              """Built-in, auditable insert plan; never blindly activate third-party VSTs.
          
              Mixer inserts are optional, and slot mixing keeps ambience additions low.
              Equalizer insertion is neutral initially: no unverified filter cutoffs.
              """
              available=set(available or [])
              plan={}
              for role,sample in roles_to_samples.items():
                  actions=[]
                  profile=sample_ambience_profile(str(sample))
                  # A neutral EQ makes later user tweaking possible; we do not pretend
                  # that adding it at default settings magically cleans up mud.
                  if role in ('bass','lead','pad','arp') and 'Lemon Parametric EQ' in available:
                      actions.append(('Lemon Parametric EQ',1.0))
                  if not profile['wet'] and role=='pad' and 'Lemon Reverb' in available:
                      actions.append(('Lemon Reverb',.08))
                  # Do NOT add Lemon Delay to lead/arp automatically. At this stage we
                  # cannot distinguish the chosen sample's rhythmic echo from the plugin's.
                  # User can still add it after audition in the Lemon Studio mixer.
                  if actions:plan[role]=actions
              return plan
          
          
          def apply_builtin_effects(rpc,channels,samples,steps,report):
              """Add only confirmed installed built-ins on dedicated composer mixer tracks."""
              try:
                  state=rpc.call('state');plugins=rpc.call('plugins')
              except Exception as exc:
                  report('Effets ignorés : impossible de lire les pistes/plugins : '+str(exc),4)
                  return []
              channel_state={c.get('id'):c for c in state.get('channels',[]) if isinstance(c,dict)}
              mixer_state={t.get('id'):t for t in state.get('mixer',[]) if isinstance(t,dict)}
              plan=plan_effects(samples,plugins.get('effects',[]))
              installed=[];used_tracks=set()
              for role,chain in plan.items():
                  cid=channels.get(role);ch=channel_state.get(cid,{})
                  tid=ch.get('track'); track=mixer_state.get(tid)
                  if not isinstance(tid,int) or not isinstance(track,dict):continue
                  if track.get('number',0)==0 or tid in used_tracks:continue
                  # Avoid touching a shared track (could belong to the user's project).
                  if any(c.get('track')==tid and c.get('id')!=cid for c in channel_state.values()):continue
                  used_tracks.add(tid)
                  occupied={v.get('slot') for v in track.get('slots',[]) if isinstance(v,dict)}
                  slots=[k for k in range(10) if k not in occupied]
                  for plugin,mix in chain:
                      if not slots:break
                      slot=slots.pop(0)
                      try:
                          _apply(rpc,[{'op':'add_effect','track':tid,'slot':slot,'plugin':plugin}],
                                 role+' - effet '+plugin,steps)
                          # Mixer slot wet/dry: 1.0 EQ, 4-8% additional ambience.
                          _apply(rpc,[{'op':'set_slot','track':tid,'slot':slot,'mix':mix}],
                                 role+' - dosage '+plugin,steps)
                          installed.append({'role':role,'effect':plugin,'mix':mix})
                      except Exception as exc:
                          report('Effet indisponible ('+role+'/'+plugin+') : '+str(exc),4)
                          # No blind retry into other tracks or unsupported VSTs.
                          break
              return installed
          
          
          def sample_safe_notes(part, notes, sample_path, bpm=190, ppq=96):
              """Prevent massive layered playback of long one-shot samples.
          
              A sample's pitch is NOT analysed. We transpose an entire motif by octaves
              (not each note separately), preserving its intervals. If the source is a
              pre-recorded chord, skank or riff, trigger monophonically and sparingly.
              Long melodic sources are thinned; the original files are never altered.
              """
              if part not in ('bass', 'lead', 'pad', 'arp') or not notes:
                  return notes
              tags=_tokens(Path(sample_path).stem)
              info=_wav_data(Path(sample_path)) if Path(sample_path).is_file() else None
              dur=(info or {}).get('duration',0)
              phrase_sample=bool(tags & {'chord','chords','skank','riff','phrase','progression','loop'})
              if phrase_sample:
                  seen=set();out=[]
                  for n in notes:
                      if n['position'] in seen:
                          continue
                      seen.add(n['position'])
                      out.append({**n,'key':60,'velocity':min(n['velocity'],88)})
              else:
                  median=sorted(n['key'] for n in notes)[len(notes)//2]
                  target=48 if part=='bass' else 62
                  shift=12*round((target-median)/12)
                  out=[{**n,'key':max(0,min(127,n['key']+shift)),
                        'velocity':min(n['velocity'],110)} for n in notes]
              # V0.11: conservatively space long recorded one-shots, including tails.
              # The additional global guard in build_song handles boundaries between
              # patterns; note length alone does NOT shorten a recorded echo.
              gap=sample_minimum_gap(part,sample_path,bpm)
              if gap>0:
                  min_ticks=max(1,int(round(gap*bpm*ppq/60.)))
                  selected=[];last=-10**12
                  for n in sorted(out,key=lambda item:(item['position'],item['key'])):
                      if n['position']-last<min_ticks:
                          continue
                      selected.append(n);last=n['position']
                  out=selected
              return out
          
          
          def _fold_label(text):
              t = unicodedata.normalize('NFKD', text.lower())
              return ''.join(c for c in t if not unicodedata.combining(c))
          
          
          def _tokens(text):
              return set(x for x in re.split(r'[^a-z0-9]+', _fold_label(text)) if x)
          
          
          def discover_pack_roots(appdata=None):
              """Read saved Lemon Studio Browser roots. No search outside user-registered folders."""
              base = Path(appdata) if appdata else Path(os.getenv('APPDATA') or (Path.home() / 'AppData' / 'Roaming'))
              file = base / 'Lemon Studio' / 'browser_folders.txt'
              try:
                  lines = file.read_text(encoding='utf-8-sig').splitlines()
              except (OSError, UnicodeError):
                  return []
              roots = []
              for line in lines:
                  label = line.split('\t', 1)[0].strip().strip('"')
                  if not label:
                      continue
                  root = Path(label).expanduser()
                  if root.is_dir() and not root.is_symlink():
                      try:
                          root = root.resolve()
                      except OSError:
                          continue
                      if root not in roots:
                          roots.append(root)
              return roots
          
          
          def _wav_data(path):
              """Read-only WAV duration and a short PCM16 sample to estimate RMS/peak; never edit audio."""
              if path.suffix.lower() != '.wav':
                  return None
              try:
                  with wave.open(str(path), 'rb') as w:
                      channels, width, rate, frames = w.getnchannels(), w.getsampwidth(), w.getframerate(), w.getnframes()
                      if not (1 <= channels <= 8 and 8_000 <= rate <= 192_000 and frames > 0):
                          return None
                      duration = round(frames/rate, 3)
                      result = {'duration':duration, 'channels':channels, 'rate':rate}
                      if width == 2:
                          data=w.readframes(min(frames, rate // 8))
                          # Compute only a small window of samples to keep scanning fast.
                          from array import array
                          values=array('h');values.frombytes(data)
                          if os.sys.byteorder != 'little':
                              values.byteswap()
                          if values:
                              result['peak'] = round(max(abs(v) for v in values)/32768,3)
                              result['rms'] = round(math.sqrt(sum(float(v)*v for v in values)/len(values))/32768,3)
                      return result
              except (wave.Error, EOFError, OSError, ValueError):
                  return None
          
          
          # A kick layer is not a full kick: TOP/CLICK = transient, PUNCH = body,
          # TAIL = long distorted bass. None is sufficient alone for a 4/4 drop.
          LAYER_ONLY_KICK = {'top', 'click', 'attack', 'transient', 'layer', 'punch', 'tail'}
          FULL_KICK_HINTS = {'full', 'complete', 'whole', 'main', 'finished'}
          
          def _is_layer_only_kick(path):
              tokens=_tokens(Path(path).stem)
              parent_tokens=_tokens(Path(path).parent.name)
              if not (tokens & {'kick','kicks','bassdrum'} or parent_tokens & {'kick','kicks','bassdrum'}):
                  return False
              if tokens & FULL_KICK_HINTS:
                  return False
              return bool((tokens | parent_tokens) & LAYER_ONLY_KICK)
          
          
          def _source_bpm(path):
              """Read reliable BPM filename labels; never infer a tempo from the waveform.
          
              In sample-pack naming conventions a phrase can end in KEY_BPM,
              e.g. OPS_MELODY_ATMOSPHERE_10_DM_150.wav. That trailing 150 is
              tempo, but the 150 in KICK_48_150_G.wav is NOT (not trailing).
              Require an explicit key token before an unlabeled trailing BPM to avoid
              mistaking arbitrary file indexes for tempos.
              """
              text=_fold_label(Path(path).stem)
              found=re.findall(r'(?:^|[^a-z0-9])(?:bpm[ _.-]*([6-9]\d|1\d\d|2[0-5]\d)|([6-9]\d|1\d\d|2[0-5]\d)[ _.-]*bpm)(?![a-z0-9])',text)
              if found:
                  return int(found[-1][0] or found[-1][1])
              # Unlike an item index, this has a harmonic context (DM_150, F#min-160).
              harmonic_tail=re.search(
                  r'(?:^|[_ .-])[a-g](?:#|b)?(?:m|min|minor|maj|major)[_ .-]([6-9]\d|1\d\d|2[0-5]\d)$',
                  text)
              return int(harmonic_tail.group(1)) if harmonic_tail else None
          
          
          def _sample_note(path):
              """A single pitched note label, e.g. BASS_10_F / Lead_C#4. NOT a key."""
              stem=Path(path).stem
              if _sample_key(path) or not (_tokens(stem)&{'bass','lead','leads','pad','synth','piano','pluck','note','oneshot','sample'}):
                  return None
              found=re.search(r'(?:^|[_ .-])([A-Ga-g])([#b]?)[0-8]?(?=$)',stem)
              if not found:return None
              label=found.group(1).upper()+found.group(2).replace('b','b').replace('B','b')
              if label in {'Db','Eb','Gb','Ab','Bb'}:
                  label={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}[label]
              return label if label in TONICS else None
          
          
          def _scale_compatible_note(note,cfg):
              if not note:return None
              root=TONICS.get(cfg['tonic'].upper())
              return root is not None and (TONICS[note]-root)%12 in SCALE[cfg['scale']]
          
          
          def _tempo_mismatch(path,cfg,features=None):
              """Prevent looping a fixed-tempo musical sample at the wrong project BPM.
          
              One-shots shorter than ~0.8s are not tempo-dependent by this heuristic.
              """
              source=_source_bpm(path)
              if not source:return False
              if abs(source-int(cfg['bpm']))/max(1,int(cfg['bpm']))<0.16:return False
              duration=(features or {}).get('duration_s')
              if duration is None:
                  data=_wav_data(Path(path))
                  duration=(data or {}).get('duration')
              # Explicitly tagged musical phrases/loops are tempo-dependent even if
              # their format cannot be decoded here. Don't silently assume time stretch.
              tags=_tokens(Path(path).stem)
              return bool(tags & {'loop','riff','phrase','sequence','arpeggio','progression',
                                  'melody','melodie','chord','chords','atmosphere'}) or (duration is not None and duration>=.85)
          
          
          def _rank_candidate(path, role, root, mood='', info=None):
              name = _tokens(path.stem)
              ancestry = set()
              current=path.parent
              for _ in range(3):
                  if current == root.parent:
                      break
                  ancestry.update(_tokens(current.name))
                  if current == root:
                      break
                  current=current.parent
              score = 0
              terms = ROLE_TERMS[role]
              for t, weight in terms.items():
                  if t in name:
                      score=max(score,weight)
                  elif t in ancestry:
                      score=max(score,int(weight*.68))
              if score < 13:
                  return 0
              if name & BAD_TOKENS:
                  return 0
              if role in ('lead','arp') and not _fit_melodic_role(path,role,mood):
                  return 0
              if role == 'kick' and infer_style(mood) == 'frenchcore' and _is_layer_only_kick(path):
                  return 0  # never turn a TOP/PUNCH/TAIL layer into the main 4/4 kick
              # Avoid confusing sample roles: e.g. a Frenchcore kick named "bass kick" is not a melodic bass.
              if role != 'kick' and 'kick' in name:
                  return 0
              if role in ('lead','pad','arp') and name & {'snare','clap','hat','hihat','kick','cymbal'}:
                  return 0
              if role in PERCUSSIVE and name & {'lead','pad','melody','piano','bassline','arp','chords'}:
                  return 0
              is_reggae = infer_style(mood) == 'reggae'
              is_hard = bool(name & {'frenchcore','hardcore','uptempo','hardstyle'} or ancestry & {'frenchcore','hardcore','uptempo','hardstyle'})
              if is_hard:
                  score += 14 if infer_style(mood) == 'frenchcore' else (-20 if is_reggae else 0)
              if is_reggae:
                  if name & {'reggae','roots','dub','jamaican'} or ancestry & {'reggae','roots','dub'}:
                      score += 20
                  if role == 'pad' and name & {'guitar','guitare','skank','chop'}:
                      score += 20
                  if role == 'arp' and name & {'organ','orgue','bubble'}:
                      score += 23
                  if role == 'bass' and name & {'warm','deep','round','roots','reggae'}:
                      score += 12
                  if role == 'hat' and name & {'shaker','hihat','hat'}:
                      score += 8
              if role=='kick' and name & FULL_KICK_HINTS:
                  score+=22  # strong evidence of a finished kick rather than a layer
              if name & {'oneshot','one','shot','single'} or ancestry & {'oneshots','oneshot','shots'}:
                  score+=4
              if path.suffix.lower()=='.wav':
                  score+=5
              if info:
                  duration=info.get('duration',0)
                  # A long recording played repeatedly as a note sounds robotic or overlaps.
                  if role in ('bass','lead','arp') and duration > 8:
                      return 0
                  if duration >= 16 or (role in PERCUSSIVE and duration > 8):
                      return 0  # most likely a full loop, not a one-shot
                  if role in ('lead','pad','arp','bass') and _tempo_mismatch(path,{'bpm':infer_bpm(mood)}, {'duration_s':duration}):
                      return 0  # time-stretching an audio phrase isn't available
                  if role=='kick' and .08 <= duration <= 3.5:
                      score+=5
                      if not is_reggae:
                          if .18 <= duration <= .65:
                              score+=12
                          elif duration > 1.5:
                              score-=35  # especially risky at Frenchcore 200 BPM
                          elif duration > .85:
                              score-=12
                  if role=='snare' and .04 <= duration <= 2.0:score+=4
                  if role=='hat' and .02 <= duration <= 1.2:score+=4
                  if role in ('lead','pad','arp','bass') and .1 <= duration <= 10:score+=3
                  if info.get('rms',0) < .0001 and info.get('peak',1) < .0005:
                      return 0
              return score
          
          
          def _sample_key(path):
              """Read an EXPLICIT filename key label, never claim audio pitch detection.
          
              Supports e.g. Lead_Dm.wav, Bass_F#minor.wav, Pads_G_major.wav.
              A token like D4 also denotes a note, but a bare product code is ignored.
              """
              stem=Path(path).stem
              explicit=re.findall(r'(?:^|[_\s.\-])([A-Ga-g])([#b]?)(?:[_\s.\-]?)(minor|major|min|maj|m)(?=$|[_\s.\-0-9])',stem,re.I)
              if not explicit:
                  return None
              note,alter,quality=explicit[-1]
              note=note.upper()
              alter=alter.upper().replace('B','b')
              label=note+alter
              if alter=='b':
                  flat={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}
                  label=flat.get(label,label)
              if label not in TONICS:
                  return None
              quality='minor' if quality.lower() in ('minor','min','m') else 'major'
              return label,quality
          
          
          def rerank_harmonic_candidates(ranked, cfg):
              """Prioritize labelled same-key one-shots; no assumption for unlabelled files."""
              out={}
              for role,items in ranked.items():
                  entries=[]
                  for item in items:
                      copy=dict(item)
                      key=_sample_key(item['path']) if role in ('bass','lead','pad','arp') else None
                      bonus=0
                      if key:
                          bonus=(27 if key==(cfg['tonic'],cfg['scale']) else -18)
                      note_label = _sample_note(item['path']) if role in ('bass','lead','pad','arp') else None
                      compatible = _scale_compatible_note(note_label,cfg) if note_label else None
                      if compatible is True:bonus+=12  # F note belongs to D natural minor
                      elif compatible is False:bonus-=22
                      if role in ('bass','lead','pad','arp') and _tempo_mismatch(item['path'],cfg,item.get('features')):
                          continue  # reject incompatible pre-recorded melodic audio
                      if role in ('lead','arp'):
                          tags=_tokens(Path(item['path']).stem)
                          if not _fit_melodic_role(item['path'],role,cfg.get('prompt','') or cfg.get('user_prompt','') or
                                                   ('Frenchcore melodique' if cfg.get('style')=='frenchcore' else cfg.get('style',''))):
                              continue
                          # The sampler's root-note alignment is not yet implemented;
                          # prefer a known pitched one-shot instead of pretending tuning is verified.
                          if not key and not note_label:
                              bonus-=12
                          if not item.get('features'):
                              bonus-=14
                          else:
                              bonus+=8
                          if role=='arp':
                              if tags & {'arp','arps','arpeggio','arpeggiator'}:bonus+=18
                              elif tags & {'pluck','plucky','plucked'}:bonus+=12
                          if role=='lead':
                              if tags & {'melodic','melodique','euphoric','euphorique','supersaw','anthem'}:
                                  bonus+=16
                      copy['score']=item['score']+bonus
                      copy['key_label']=key
                      copy['note_label']=note_label
                      entries.append(copy)
                  out[role]=sorted(entries,key=lambda x:(-x['score'],x['path'].lower()))
              return out
          
          
          def find_pack_candidates(roots, prompt, *, max_files=60_000, finalists=16):
              """Search user-declared packs only. Analyse audio for short-listed files,
              not all 60k samples; never modify pack files. Keep 16 choices per role.
              """
              roots=[Path(p) for p in roots if Path(p).is_dir()]
              if not roots:
                  raise ValueError('Aucun dossier de pack trouvé. Ajoute ton dossier de samples dans le Browser de Lemon Studio, puis réessaie.')
              pools={role:[] for role in ROLE_ORDER}
              seen=0
              for root in roots:
                  for parent, dirs, files in os.walk(root, followlinks=False):
                      dirs[:]=sorted(d for d in dirs if d not in ('__MACOSX','.git','node_modules')
                                     and not d.startswith('.') and not (Path(parent)/d).is_symlink())
                      for filename in sorted(files):
                          p=Path(parent)/filename
                          if p.suffix.lower() not in SAMPLE_EXTENSIONS or p.is_symlink():continue
                          seen+=1
                          if seen>max_files:
                              raise ValueError(f'Plus de {max_files} samples détectés. Réduis les dossiers du Browser.')
                          try:
                              if not 1024<=p.stat().st_size<=120_000_000:continue
                          except OSError:continue
                          for role in ROLE_ORDER:
                              score=_rank_candidate(p,role,root,mood=prompt)
                              if score:
                                  pools[role].append({'path':str(p),'score':score,'audio':{},'root':str(root)})
              cache={};ranked={}
              # A generous preliminary pool lets us reject misleading filenames after
              # inspecting audio. Cache avoids decoding the same file for multiple roles.
              for role,items in pools.items():
                  ordered=sorted(items,key=lambda a:(-a['score'],a['path'].lower()))
                  cap=max(40,finalists*3)
                  # Avoid an alphabetical first-N bias across large professional packs:
                  # cover the leading tier AND other packs/subfolders deterministically.
                  if len(ordered)>cap:
                      seen_paths=set();pre=[]
                      for item in ordered[:cap//2]+[ordered[i] for i in
                                  range(cap//2,len(ordered),max(1,(len(ordered)-cap//2)//(cap//2)))]:
                          if item['path'] not in seen_paths:
                              pre.append(item);seen_paths.add(item['path'])
                          if len(pre)>=cap:break
                  else:pre=ordered
                  chosen=[]
                  for item in pre:
                      path=item['path']
                      if path not in cache:
                          cache[path]=(_wav_data(Path(path)),_audio_features(Path(path)))
                      meta,features=cache[path]
                      new=dict(item)
                      new['audio']=meta or {}
                      new['features']=features or {}
                      new['score']=_rank_candidate(Path(path),role,Path(item['root']),mood=prompt,info=meta)
                      if new['score']>0:
                          new['score']+=_audio_role_score(role,features,Path(path),prompt)
                          chosen.append(new)
                  ordered=sorted(chosen,key=lambda a:(-a['score'],a['path'].lower()))
                  # Cover independent folders and packs instead of letting one producer's
                  # alphabetical series occupy every candidate slot.
                  diversified=[];folder_counts={};root_counts={};used=set()
                  for item in ordered:
                      folder=str(Path(item['path']).parent).lower();root=item['root'].lower()
                      if folder_counts.get(folder,0)>=4 or root_counts.get(root,0)>=max(6,finalists//2):continue
                      diversified.append(item);used.add(item['path'])
                      folder_counts[folder]=folder_counts.get(folder,0)+1
                      root_counts[root]=root_counts.get(root,0)+1
                      if len(diversified)>=finalists:break
                  for item in ordered:
                      if len(diversified)>=finalists:break
                      if item['path'] not in used:diversified.append(item);used.add(item['path'])
                  ranked[role]=diversified
              return ranked,seen
          
          
          
          def _audio_features(path):
              """Bounded PCM-WAV analysis, pure stdlib. No AI audio listening.
          
              Approximate spectral bands from one-pole filters, transient and tail,
              stereo width, short-time peak/RMS. Supports PCM 8/16/24/32 bit WAV. The
              input is opened read-only and processed for at most 1.8s / ~22k points.
              Return None for formats we cannot decode reliably (FLAC/MP3/float WAV).
              """
              if Path(path).suffix.lower()!='.wav':return None
              try:
                  with wave.open(str(path),'rb') as w:
                      if w.getcomptype()!='NONE':return None
                      width=w.getsampwidth();ch=w.getnchannels();rate=w.getframerate()
                      if width not in (1,2,3,4) or ch not in (1,2) or not 8000<=rate<=192000:
                          return None
                      frames=min(w.getnframes(),int(1.8*rate));data=w.readframes(frames)
                  if frames<128:return None
                  raw=memoryview(data);stride=ch*width;step=max(1,rate//12000)
                  dt=step/rate
                  alphas=[1-math.exp(-2*math.pi*freq*dt) for freq in (130,350,2400)]
                  lp=[0.,0.,0.];ener=[0.,0.,0.,0.]
                  total=0.; peak=0.;side=0.;samples=0;late=0.;late_n=0
                  bins=[0.]*90;bin_n=[0]*90
                  def get(off):
                      if width==1:return (raw[off]-128)/128.
                      if width==2:return int.from_bytes(raw[off:off+2],'little',signed=True)/32768.
                      if width==3:return int.from_bytes(raw[off:off+3],'little',signed=True)/8388608.
                      return int.from_bytes(raw[off:off+4],'little',signed=True)/2147483648.
                  for idx in range(0,frames,step):
                      k=idx*stride
                      a=get(k)
                      if ch==2:
                          b=get(k+width);x=(a+b)/2;side+=(a-b)**2/4
                      else:x=a
                      for j,alpha in enumerate(alphas):lp[j]+=alpha*(x-lp[j])
                      bands=(lp[0],lp[1]-lp[0],lp[2]-lp[1],x-lp[2])
                      for j,v in enumerate(bands):ener[j]+=v*v
                      sq=x*x;total+=sq;peak=max(peak,abs(x));samples+=1
                      if idx/rate>=.25:late+=sq;late_n+=1
                      bi=min(89,int(idx/rate/.02));bins[bi]+=sq;bin_n[bi]+=1
                  if samples==0:return None
                  energy=sum(ener) or 1.
                  band=[v/energy for v in ener]
                  rms=math.sqrt(total/samples)
                  env=[math.sqrt(v/n) if n else 0 for v,n in zip(bins,bin_n)]
                  mx=max(env) if env else 0
                  tail=(max([i for i,v in enumerate(env) if v>mx*.12],default=0)+1)*.02 if mx>0 else 0
                  return {'duration_s':round(frames/rate,2),'rms':round(rms,4),
                          'peak':round(peak,4),'crest':round(peak/max(rms,.00001),2),
                          'low':round(band[0]+band[1],3),'sub':round(band[0],3),
                          'mid':round(band[2],3),'high':round(band[3],3),
                          'stereo':round(min(1.,math.sqrt(side/max(total,.00001))),3),
                          'tail_s':round(tail,2),
                          'active':round(sum(v>max(.003,mx*.09) for v in env)/max(1,sum(n>0 for n in bin_n)),3),
                          'decoded_seconds':round(frames/rate,2)}
              except (wave.Error, OSError, ValueError, OverflowError, EOFError, TypeError):
                  return None
          
          
          def _audio_role_score(role,features,path,prompt):
              """Small, bounded role-fit bonus. Never equate loudness to quality."""
              if not features:return -3  # a name alone gives weak confidence
              duration=features['duration_s'];high=features['high'];low=features['low']
              tail=features['tail_s'];crest=features['crest'];score=0.
              style=infer_style(prompt)
              bpm=infer_bpm(prompt)
              beat=60/max(60,bpm)
              if role=='kick':
                  if low>.18:score+=7
                  if crest>1.3:score+=4
                  if style=='frenchcore':
                      if tail>beat*3:score-=18
                      elif tail<=beat*1.7:score+=8
                      if high>.10:score+=3  # some click/edge is expected
                  elif tail>.9:score-=7
              elif role=='snare':
                  score+=5 if high+features['mid']>.22 else -6
                  if tail>.85:score-=8
              elif role=='hat':
                  score+=11 if high>.23 else -8
                  if duration>1.5:score-=12
              elif role=='bass':
                  score+=10 if low>.20 else -7
                  if high>.60:score-=9
              elif role in ('lead','arp'):
                  if high+features['mid']>.16:score+=5
                  if duration>5:score-=12
              elif role=='pad':
                  if duration>.4:score+=5
                  if crest>12:score-=5
              if features['peak']>.995 and crest<2.0:
                  score-=3  # saturated sample is not necessarily bad, but risky to stack
              return max(-22,min(18,score))
          
          
          def _sample_pair_score(role_a,a,role_b,b,cfg):
              """Compatibility heuristic, not a psychoacoustic or tonal guarantee."""
              if a['path']==b['path']:return -400.
              roles={role_a,role_b};fa=a.get('features') or {};fb=b.get('features') or {}
              score=0.
              if roles=={'kick','bass'} and fa and fb:
                  kick,bass=(fa,fb) if role_a=='kick' else (fb,fa)
                  if kick['sub']>.24 and bass['sub']>.28:score-=6
                  if kick['low']>.48 and bass['low']>.58:score-=7
                  if kick['tail_s']>60/max(60,cfg['bpm'])*1.8:score-=9
                  if kick['tail_s']<60/max(60,cfg['bpm'])*1.7 and bass['low']>.2:score+=5
              if roles=={'lead','pad'} and fa and fb:
                  if fa['high']>.72 and fb['high']>.72:score-=4
                  if fa['high']<.25 and fb['high']>.3:score+=2
              pitched={'bass','lead','pad','arp'}
              if role_a in pitched and role_b in pitched:
                  na=a.get('note_label') or _sample_note(a['path'])
                  nb=b.get('note_label') or _sample_note(b['path'])
                  if na and _scale_compatible_note(na,cfg) is False:score-=16
                  if nb and _scale_compatible_note(nb,cfg) is False:score-=16
                  ka=a.get('key_label') or _sample_key(a['path'])
                  kb=b.get('key_label') or _sample_key(b['path'])
                  if ka and kb:
                      # D minor / F major (relative keys) often share material. Do not
                      # falsely reject this harmonically compatible relationship.
                      if ka==kb:score+=10
                      elif (ka[1]=='minor' and kb[1]=='major' and (TONICS[kb[0]]-TONICS[ka[0]])%12==3) or (kb[1]=='minor' and ka[1]=='major' and (TONICS[ka[0]]-TONICS[kb[0]])%12==3):
                          score+=5
                      else:score-=32
              if roles=={'snare','hat'} and fa and fb and fa['high']>.65 and fb['high']>.65:
                  score-=2
              return score
          
          
          def _combination_score(combo,cfg,suggestions=None):
              total=0.
              suggestions=suggestions or {}
              roles=sorted(combo)
              for role in roles:
                  item=combo[role]
                  total+=float(item.get('score',0))
                  if suggestions.get(role)==item['path']:total+=5. # Qwen advises; cannot override signal fit
              for i,role in enumerate(roles):
                  for other in roles[i+1:]:
                      total+=_sample_pair_score(role,combo[role],other,combo[other],cfg)
              return total
          
          
          def select_compatible_samples(ranked,cfg,suggestions=None):
              """Deterministic coordinate descent over 7 roles * 16 finalists.
              Uses two starting points and evaluates whole-kit compatibility, not first
              file in every folder. Strictly prevents a reused path in different roles.
              """
              suggestion=suggestions or {}
              roles=[r for r in ROLE_ORDER if ranked.get(r)]
              if not roles:return {},{}
              seeds=[]
              for seed_idx in range(3):
                  combo={};used=set()
                  for role in roles:
                      candidates=ranked[role]
                      order=(sorted(candidates,key=lambda x:(-x['score'],x['path'].lower())) if seed_idx==0 else
                             sorted(candidates,key=lambda x:(x['path']!=suggestion.get(role),-x['score'])) if seed_idx==1 else
                             list(reversed(candidates)))
                      for item in order:
                          if item['path'] not in used:
                              combo[role]=item;used.add(item['path']);break
                  seeds.append(combo)
              best={};best_score=float('-inf')
              for combo in seeds:
                  for _ in range(5):
                      improved=False
                      for role in roles:
                          options=[x for x in ranked[role] if x['path'] not in {v['path'] for k,v in combo.items() if k!=role}]
                          if not options:continue
                          old=combo.get(role)
                          cur_score=_combination_score(combo,cfg,suggestion)
                          winner=old
                          for candidate in options:
                              combo[role]=candidate
                              value=_combination_score(combo,cfg,suggestion)
                              if value>cur_score+1e-7:
                                  winner=candidate;cur_score=value;improved=True
                          if winner is not None:combo[role]=winner
                      if not improved:break
                  total=_combination_score(combo,cfg,suggestion)
                  if total>best_score:
                      best_score=total;best=combo.copy()
              audit={}
              for role,item in best.items():
                  alternatives=[x for x in ranked[role] if x['path']!=item['path']]
                  alt=alternatives[0]['path'] if alternatives else None
                  f=item.get('features') or {}
                  reasons=[]
                  if f:
                      reasons.append('signal WAV analysé')
                      if role in ('kick','bass'):
                          reasons.append('énergie graves %.0f %%'%(100*f['low']))
                      if role=='kick':reasons.append('queue %.2f s'%f['tail_s'])
                      if role in ('hat','snare'):reasons.append('aigus %.0f %%'%(100*f['high']))
                  else:reasons.append('signal non décodé : sélection moins fiable')
                  if item.get('key_label') or _sample_key(item['path']):reasons.append('tonalité complète étiquetée (non vérifiée à l’oreille)')
                  if item.get('note_label') or _sample_note(item['path']):
                      label=item.get('note_label') or _sample_note(item['path'])
                      reasons.append('note '+label+' ('+('dans la gamme' if _scale_compatible_note(label,cfg) else 'hors gamme')+' ; accordage de lecture non vérifié)')
                  if _source_bpm(item['path']):reasons.append('BPM du fichier '+str(_source_bpm(item['path']))+' (pas de time-stretch)')
                  if role in ('kick','bass') and 'kick' in best and 'bass' in best:
                      reasons.append('testé avec '+('basse' if role=='kick' else 'kick'))
                  if role=='arp':reasons.append('rôle arp/pluck explicite dans le nom ou dossier')
                  if role=='lead' and cfg.get('style')=='frenchcore':
                      reasons.append('filtre de compatibilité mélodique appliqué')
                  if role in ('lead','arp') and not item.get('features'):
                      reasons.append('ATTENTION : hauteur sonore non vérifiée')
                  if suggestion.get(role)==item['path']:reasons.append('préféré par Qwen')
                  audit[role]={'reason':', '.join(reasons),'alternative':Path(alt).name if alt else '',
                               'analysed':bool(f),'score':round(item['score'],1)}
              return {r:x['path'] for r,x in best.items()},audit
          
          
          def choose_samples_local(ranked,cfg=None):
              """Offline whole-kit optimisation, never first-file by default."""
              cfg=cfg or normalize({},'Frenchcore à 200 BPM')
              chosen,_=select_compatible_samples(rerank_harmonic_candidates(ranked,cfg),cfg)
              return chosen
          
          
          def choose_samples_ollama(ranked,prompt,model,cfg=None):
              """Qwen proposes; joint audio-aware optimiser selects. Never first-file fallback."""
              cfg=cfg or normalize({},prompt)
              ranked=rerank_harmonic_candidates(ranked,cfg)
              if not any(ranked.values()):return {},'aucun sample pertinent',{}
              options={role:[{'n':i,'file':Path(item['path']).name,'folder':Path(item['path']).parent.name,
                              'duration_s':item['audio'].get('duration'),
                              'grave_%':round(100*item['features'].get('low',0)) if item.get('features') else None,
                              'aigu_%':round(100*item['features'].get('high',0)) if item.get('features') else None,
                              'tail_s':item.get('features',{}).get('tail_s'),
                              'score':round(item['score'],1)} for i,item in enumerate(items[:10])]
                       for role,items in ranked.items() if items}
              system=('Tu es conseiller de sélection de samples pour une production musicale. '
                      'Sélectionne des one-shots cohérents avec le genre demandé. '
                      'Ne décide jamais uniquement sur la numérotation, compare nom, durée, catégories et caractéristiques mesurées. '
                      'Pour la Frenchcore, kick incisif et tail contrôlée, basse complémentaire, lead clair. '
                      'Pour le reggae, kick doux, basse ronde, snare/rimshot et skank/organ. '
                      'Réponds UNIQUEMENT JSON indices, ex {"kick":1,"bass":0,"lead":3}. Aucun chemin de fichier.')
              suggestions={};note='analyse audio + optimisation des associations'
              if model:
                  try:
                      request={'model':model,'stream':False,'format':'json',
                               'prompt':system+'\n'+json.dumps({'demande':prompt[:650],'candidats':options},ensure_ascii=False),
                               'options':{'temperature':.1,'num_predict':650},'keep_alive':'10m'}
                      call=urllib.request.Request('http://127.0.0.1:11434/api/generate',
                               data=json.dumps(request,ensure_ascii=False).encode('utf-8'),
                               headers={'Content-Type':'application/json'},method='POST')
                      with urllib.request.urlopen(call,timeout=110) as resp:
                          answer=json.loads(resp.read(1_000_000).decode('utf-8')).get('response','')
                      try:
                          picks=extract_json(answer)
                      except ValueError:
                          # One short retry with fewer candidates and a minimal schema.
                          request['prompt']='Donne un objet JSON valide avec seulement les numéros des samples, sans explication.\n'+json.dumps(options,ensure_ascii=False)
                          request['options']['num_predict']=900
                          retry=urllib.request.Request('http://127.0.0.1:11434/api/generate',
                              data=json.dumps(request,ensure_ascii=False).encode('utf-8'),
                              headers={'Content-Type':'application/json'},method='POST')
                          with urllib.request.urlopen(retry,timeout=110) as resp:
                              answer=json.loads(resp.read(1_000_000).decode('utf-8')).get('response','')
                          picks=extract_json(answer)
                      for role,items in ranked.items():
                          idx=picks.get(role)
                          if type(idx) is int and 0<=idx<min(10,len(items)):
                              suggestions[role]=items[idx]['path']
                      note+=' + avis de Qwen'
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError,ValueError,TypeError,KeyError,OSError) as exc:
                      note+=' (Qwen non exploitable : '+_small(type(exc).__name__+': '+str(exc),100)+' ; classement local)'
              chosen,audit=select_compatible_samples(ranked,cfg,suggestions)
              return chosen,note,audit
          
          
          
          def _small(text, limit=80):
              if not isinstance(text, str):
                  return ""
              return "".join(c for c in text if c.isprintable())[:limit].strip()
          
          
          def extract_json(text):
              if not isinstance(text, str):
                  raise ValueError("Réponse du modèle absente")
              idx = text.find("{")
              if idx < 0:
                  raise ValueError("Ollama n'a pas renvoyé le plan JSON attendu")
              try:
                  obj, _ = json.JSONDecoder().raw_decode(text[idx:])
              except json.JSONDecodeError as e:
                  raise ValueError("Le plan musical renvoyé par Ollama n'est pas un JSON valide") from e
              if not isinstance(obj, dict):
                  raise ValueError("Le plan musical doit être un objet JSON")
              return obj
          
          
          def infer_style(prompt):
              '''Explicit genre names take precedence over anything the language model guesses.'''
              t = _fold_label(str(prompt or ''))
              if re.search(r'\b(reggae|ragga|one[- ]drop|roots reggae|dub reggae|ska|skank)\b', t):
                  return 'reggae'
              if re.search(r'\b(frenchcore|hardcore|uptempo|hardstyle|rawstyle)\b', t):
                  return 'frenchcore'
              if re.search(r'\b(hip[- ]?hop|boom[- ]?bap|trap|rap)\b', t):
                  return 'hiphop'
              if re.search(r'\b(house|techno|trance|dance)\b', t):
                  return 'dance'
              return 'generic'
          
          
          
          def reggae_groove(prompt, bpm):
              """Roots keeps One Drop; faster reggae-disco/dancehall has a different drum pocket."""
              t = _fold_label(str(prompt))
              if re.search(r'\b(one[- ]drop|roots|traditionnel|traditional|dub roots)\b', t):
                  return 'one_drop'
              if re.search(r'\b(disco|dancehall|crossover|modern|moderne|dansant|rapide|fast|festif|groove rapide)\b', t) or bpm >= 108:
                  return 'reggae_disco'
              return 'one_drop'
          
          def infer_bpm(prompt):
              m = re.search(r"\b(\d{2,3})\s*bpm\b", prompt, re.I)
              if m:
                  return max(60, min(240, int(m.group(1))))
              return {'reggae':78, 'frenchcore':195, 'hiphop':92, 'dance':128, 'generic':140}[infer_style(prompt)]
          
          
          def infer_seconds(prompt, bpm):
              m = re.search(r"\b(\d{1,2})\s*(?:min(?:utes?)?|mn)\b", prompt.lower())
              if m:
                  return max(30, min(240, int(m.group(1))*60))
              m = re.search(r"\b(\d{2,3})\s*(?:sec(?:ondes?)?|s)\b", prompt.lower())
              if m:
                  return max(30, min(240, int(m.group(1))))
              return 90
          
          
          def plan_from_ollama(prompt, model, state):
              if not model or not isinstance(model, str):
                  raise ValueError("Indique le modèle Ollama (ex. qwen2.5:7b-instruct)")
              sys_prompt = '''Tu es un arrangeur et compositeur musical. Transforme la demande en plan de composition pour un DAW.
          Réponds exclusivement par un objet JSON, sans commentaire et sans markdown:
          {"title":"Reggae Roots","style":"reggae","bpm":78,"tonic":"G","scale":"major","mood":"chaleureux","progression":[0,3,4,0],"motif":[0,2,4,3,2,0,4,2],"hooks":{"a":[0,2,4,3,2,0,4,2],"b":[2,4,5,4,2,1,0,2],"bridge":[0,3,2,0,5,4,2,0]},"energy":0.65}
          Toutes les valeurs doivent être simples. tonic = C,C#,D,D#,E,F,F#,G,G#,A,A#,B; scale = minor ou major.
          style = reggae, frenchcore, hiphop, dance ou generic. Respecte impérativement le genre donné.
          REGGAE : pour reggae ROOTS traditionnel, One Drop (kick + snare sur le 3e temps), skank en contretemps, orgue bubble, basse syncopée. Pour reggae DISCO/dancehall rapide, privilégie un backbeat dansant et des contretemps ; ne force pas le One Drop. Évite de confondre avec un kick techno.
          FRENCHCORE : kick sur chaque temps, basse énergique, lead rapide, break et drop.
          progression = quatre degrés ENTIERs de 0 à 6; motif = huit degrés ENTIERs de 0 à 13.
          IMPORTANT : hooks.a et hooks.b sont deux mélodies originales distinctes, huit degrés de 0 à 13 chacun, destinées aux deux refrains/drops ; hooks.bridge est un thème doux. Évite de réécrire le même motif en le décalant d'une note ; construis un contraste de contour et de cadence. Tous les degrés sont relatifs à l'accord de la mesure.
          Ne renvoie jamais de commandes système, d'instructions, de chemins ni de code. Sélectionne un tempo, une tonalité et un motif adaptés à la demande.'''
              req = {
                  "model": model[:100], "stream": False, "format": "json",
                  "prompt": sys_prompt + "\nDemande de l'utilisateur: " + prompt[:2200] + "\nBPM actuel: " + str(state.get("tempo", "inconnu")),
                  "options": {"temperature": 0.45, "num_predict": 820},
                  "keep_alive": "10m"
              }
              error=None
              for attempt in range(2):
                  if attempt:
                      req['options']['num_predict']=1500
                      req['options']['temperature']=0.2
                      req['prompt']='Réponds par UN OBJET JSON valide et court, sans markdown.\n'+sys_prompt.split('REGGAE :')[0]+'\nDemande: '+prompt[:850]
                  data=json.dumps(req,ensure_ascii=False).encode('utf-8')
                  http=urllib.request.Request('http://127.0.0.1:11434/api/generate',data=data,
                      headers={'Content-Type':'application/json'},method='POST')
                  try:
                      with urllib.request.urlopen(http,timeout=180) as response:
                          result=json.loads(response.read(1_000_000).decode('utf-8'))
                  except urllib.error.HTTPError as e:
                      detail=e.read(500).decode('utf-8','replace')
                      raise RuntimeError(f'Ollama HTTP {e.code} : {detail}') from None
                  except (urllib.error.URLError,TimeoutError) as e:
                      raise RuntimeError(f'Ollama inaccessible ou délai dépassé : {e}') from None
                  try:return extract_json(result.get('response',''))
                  except ValueError as e:error=e
              raise ValueError('Ollama a renvoyé deux plans JSON invalides. Vérifie le modèle ou simplifie la consigne. Dernière erreur : '+str(error))
          
          
          def normalize(raw, prompt):
              """Allowlist the model's musical metadata; never translate its output into arbitrary RPC commands."""
              if not isinstance(raw, dict):
                  raise ValueError("Le modèle n'a pas envoyé de plan musical")
              bpm = infer_bpm(prompt)
              # An explicit BPM from the user always wins over the model.
              if not re.search(r"\b\d{2,3}\s*bpm\b", prompt, re.I):
                  try:
                      bpm = max(60, min(240, int(raw.get("bpm", bpm))))
                  except (ValueError, TypeError):
                      pass
              style_hint = infer_style(prompt)
              if style_hint == 'reggae' and not re.search(r"\b\d{2,3}\s*bpm\b", prompt, re.I):
                  # The model may ignore the requested groove and hallucinate a dance tempo.
                  bpm = max(60, min(110, bpm))
              tonic = str(raw.get("tonic", "G" if style_hint == 'reggae' else "A")).upper().replace("♯", "#").replace("♭", "B")
              if tonic not in TONICS:
                  tonic = "A"
              scale = str(raw.get("scale", "minor")).lower()
              if scale not in SCALE:
                  scale = "minor"
              # An explicit key in the user's prompt takes priority over Ollama's guess,
              # just like an explicit BPM. Recognize French solfege and English names.
              explicit_key = re.search(
                  r"\b(?:en|in)\s+(do|ré|re|mi|fa|sol|la|si|[a-g](?:[#♯b♭])?)\s+"
                  r"(mineur|majeur|minor|major)\b", prompt, re.IGNORECASE)
              if explicit_key:
                  written=explicit_key.group(1).lower()
                  solfege={'do':'C','ré':'D','re':'D','mi':'E','fa':'F',
                           'sol':'G','la':'A','si':'B'}
                  requested=solfege.get(written, written.upper().replace('♯','#').replace('♭','B'))
                  if requested in TONICS:
                      tonic=requested
                      scale='minor' if explicit_key.group(2).lower() in ('mineur','minor') else 'major'
              def degrees(x, n, fallback, hi):
                  if not isinstance(x, list) or len(x) != n:
                      return fallback
                  if not all(type(a) is int and 0 <= a <= hi for a in x):
                      return fallback
                  return x
              progression = degrees(raw.get("progression"), 4, [0,5,2,6] if scale == "minor" else [0,4,5,3], 6)
              motif = degrees(raw.get("motif"), 8, [0,2,4,5,4,2,1,0], 13)
              hooks = _distinct_hooks(motif, raw.get('hooks'))
              energy = raw.get("energy", 0.8)
              if isinstance(energy, bool) or not isinstance(energy, (int,float)) or not math.isfinite(energy):
                  energy = 0.8
              energy = max(0.35,min(1.0,float(energy)))
              # Never let a hallucinated style override a genre explicitly requested in French.
              style = infer_style(prompt)
              if style == 'generic':
                  candidate = str(raw.get('style','generic')).lower().strip()
                  style = candidate if candidate in ('reggae','frenchcore','hiphop','dance','generic') else 'generic'
              seconds = infer_seconds(prompt,bpm)
              bars = max(32, min(MAX_BARS, round((seconds * bpm / 240) / 4) * 4))
              seed_bytes=json.dumps({'prompt':prompt[:1000], 'bpm':bpm, 'tonic':tonic,
                                     'scale':scale,'progression':progression,'motif':motif,'hooks':hooks},
                                    ensure_ascii=False,sort_keys=True).encode('utf-8')
              seed=int.from_bytes(hashlib.sha256(seed_bytes).digest()[:8],'little')
              return {"title":_small(raw.get("title"),65) or "Composition automatique", "bpm":bpm, "tonic":tonic,
                      "scale":scale,"progression":progression,"motif":motif,"hooks":hooks,"energy":energy,"bars":bars,
                      "seconds":round(bars*240/bpm),"mood":_small(raw.get("mood"),80),"style":style,
                      "groove":reggae_groove(prompt,bpm) if style == 'reggae' else 'modern', "seed":seed}
          
          
          
          def _distinct_hooks(motif, proposed=None):
              """Three 8-degree themes. Strictly validate model material; deterministic fallbacks.
          
              Degree values are relative to the CURRENT chord root, not a fixed global
              pitch class. This lets a real four-chord progression be heard throughout.
              """
              def valid(seq):
                  return (isinstance(seq,list) and len(seq)==8 and
                          all(type(v) is int and 0<=v<=13 for v in seq))
              base=list(motif)
              proposed=proposed if isinstance(proposed,dict) else {}
              a=proposed.get('a') if valid(proposed.get('a')) else base
              fallback_b=[min(13,max(0,base[k]+(-2 if k in (1,4,6) else 2 if k in (2,5) else 0))) for k in (0,2,1,4,3,6,5,0)]
              b=proposed.get('b') if valid(proposed.get('b')) else fallback_b
              if sum(x!=y for x,y in zip(a,b)) < 3:
                  b=[min(13,max(0,a[k]+(1 if i%2 else -1))) for i,k in enumerate((2,0,4,3,6,5,1,7))]
              fallback_break=[max(0,min(13,x)) for x in (a[0],a[2],a[4],a[3],a[0],a[5],a[1],a[0])]
              bridge=proposed.get('bridge') if valid(proposed.get('bridge')) else fallback_break
              return {'a':list(a),'b':list(b),'bridge':list(bridge)}
          
          
          def _rhythm_shape(cfg, sec, phrase_pos):
              """Musically distinct quarter-beat-grid call/answer phrase shapes.
          
              Rhythm arrays can come from Ollama, but are validated during normalization.
              Avoid a copied eight-note machine-gun every bar.
              """
              bank = (
                  (0., .75, 1.50, 2.50, 3.25),
                  (0., .5, 1.75, 2.75),
                  (.25, 1., 2., 2.5, 3.5),
                  (0., 1., 1.5, 3.),
              )
              alt = (
                  (.25, .75, 1.75, 2.5, 3.25),
                  (0., 1.25, 2.25, 3.5),
                  (0., .5, 1.25, 2.25, 3.25),
                  (0., 1.5, 2.75, 3.5),
              )
              if sec in (3, 6):
                  key='a' if sec==3 else 'b'
                  custom=(cfg.get('rhythms') or {}).get(key)
                  if isinstance(custom,tuple):
                      return custom if phrase_pos%2==0 else bank[(phrase_pos+1)%4]
                  return (bank if sec==3 else alt)[phrase_pos]
              return bank[phrase_pos]
          
          
          def _phrase_arrange(notes, part, sec, bars, ppq, cfg):
              """Conservative section orchestration: intentional gaps and human accents.
          
              Do not generate audio or modify samples; applies only to generated MIDI.
              """
              if not notes:
                  return notes
              style=cfg.get('style')
              bar_ticks=ppq*4
              out=[]
              for n in notes:
                  bar=n['position']//bar_ticks
                  beatpos=n['position']%bar_ticks
                  if style=='frenchcore' and sec in (3,6):
                      # The counterline comes and goes, rather than looping throughout.
                      if part=='arp' and bar%8 in (0,1,6):
                          continue
                      if part=='pad' and bar%8 in (2,3,6,7):
                          continue
                      # First beat of every eighth bar: momentary top-end gap.
                      if part=='hat' and bar%8==7 and beatpos>=3*ppq:
                          continue
                  if style=='frenchcore' and sec==4 and part=='hat':
                      continue
                  out.append(n)
              return out
          
          
          def _stage_frenchcore_teaser(part, sec, notes, bars, ppq, cfg):
              """V0.13: introduce new instruments across the 16-bar teaser in stages.
          
              The V0.12 teaser previously started kick+snare+bass+hat+lead+pad together
              at 9.6s, even after an almost silent intro. Deliberately layer sounds over
              successive bars; never edit, stretch or otherwise rewrite pack samples.
              This is MIDI orchestration only, NOT a true gain automation/crossfade.
              """
              if cfg.get('style')!='frenchcore' or sec!=1 or not notes:
                  return notes
              bar_ticks=4*ppq
              # Fractions scale for shorter/longer teasers; 16 bars yields [0,2,4,6,8,10].
              start_fraction={'lead':0.,'pad':0.,'hat':.125,'bass':.25,
                              'kick':.375,'snare':.50,'arp':.625}
              start=max(0,min(bars-1,round(bars*start_fraction.get(part,0))))
              selected=[]
              for n in sorted(notes,key=lambda x:(x['position'],x['key'])):
                  b=n['position']//bar_ticks
                  if b<start:
                      continue
                  within=n['position']%bar_ticks
                  age=b-start
                  # Only ONE accent on the first kick bar, then two; do not jump from
                  # silence to a full rhythmic kit on the section boundary.
                  if part=='kick' and (age<2 and within!=0):
                      continue
                  if part=='snare' and (age<3 and within!=3*ppq):
                      continue
                  # Early hat/arp gestures are sparse; they fill out later.
                  if part in ('hat','arp') and age<3 and within<3*ppq:
                      continue
                  if part=='bass' and age<3 and within>=2*ppq:
                      continue
                  # Limit early leading velocities but preserve the user's source audio.
                  cap = {'kick':(82,92),'snare':(70,84),'bass':(69,80),
                         'hat':(50,60),'arp':(58,68),'lead':(78,87),'pad':(76,86)}
                  early,late=cap.get(part,(84,100))
                  limit=early if age<2 else late if age<4 else 128
                  selected.append({**n,'velocity':min(n['velocity'],limit)})
              return selected
          
          
          def modern_section_lengths(total_bars, style='frenchcore'):
              """8 sections with short intros, distinct drops and a genuine melodic break.
          
              Integer rounding preserves the 4-bar grid and total length for 30s-4m demos.
              """
              weight = ((0.05, 0.10, 0.09, 0.24, 0.15, 0.09, 0.22, 0.06) if style == 'frenchcore'
                        else (0.05, 0.15, 0.13, 0.13, 0.11, 0.11, 0.22, 0.10))
              chunks = max(8, total_bars // 4)
              out = [1] * 8
              remaining = chunks - 8
              for _ in range(remaining):
                  i = max(range(8), key=lambda j: (weight[j]*chunks - out[j], weight[j]))
                  out[i] += 1
              assert sum(out) == chunks
              return [4*n for n in out]
          
          
          def modern_section_labels(cfg):
              if cfg.get('style') == 'reggae':
                  if cfg.get('groove') == 'reggae_disco':
                      return ('Intro courte', 'Groove', 'Hook', 'Variation', 'Break instrumental', 'Relance', 'Refrain final', 'Outro')
                  return ('Intro courte', 'Couplet', 'Hook', 'Variation', 'Dub break', 'Relance', 'Dernier refrain', 'Outro')
              if cfg.get('style') == 'frenchcore':
                  return ('Intro hook', 'Teaser melodique', 'Montee 1', 'Drop A', 'Break melodique', 'Montee 2', 'Drop B - variation', 'Outro')
              return ('Intro', 'Theme', 'Montee', 'Partie A', 'Break', 'Reprise', 'Final', 'Outro')
          
          def section_lengths(total_bars):
              """8 proportional sections, each multiple of 4 bars, sum exactly total_bars."""
              weights = (0.08,0.12,0.12,0.22,0.13,0.12,0.16,0.05)
              chunks = total_bars // 4
              out = [max(1,round(chunks*x)) for x in weights]
              while sum(out)>chunks:
                  idx=max((i for i,v in enumerate(out) if v>1),key=lambda i:out[i],default=None)
                  if idx is None:break
                  out[idx]-=1
              while sum(out)<chunks:
                  i=max(range(len(weights)),key=lambda j:(chunks*weights[j]-out[j],weights[j]))
                  out[i]+=1
              assert sum(out)==chunks
              return [k*4 for k in out]
          
          
          def _semid(tonic, scale, deg):
              sc=SCALE[scale]
              return TONICS[tonic]+sc[deg%7]+12*(deg//7)
          
          
          def note(channel, position,length,key,velocity=100):
              return {"channel":int(channel),"position":int(position),"length":max(1,int(length)),
                      "key":max(0,min(127,int(key))),"velocity":max(1,min(128,int(velocity))),"pan":64}
          
          
          
          
          def _reggae_section_notes(part, section_index, bars, ppq, cfg, channel):
              """Real reggae rhythmic vocabulary (1 bar = 4 beats):
          
              * One Drop: kick and snare TOGETHER on beat three, not four-on-the-floor.
              * Skank: short triads at each offbeat (the 'and' of 1, 2, 3, 4).
              * Organ bubble: offbeat chords plus occasional sixteenth-note pickup.
              * Bass: long roots, syncopated anticipations; not a 4/4 techno bass.
              The pattern is MIDI only. Sample quality/tuning still depends on the packs.
              """
              beat=ppq
              bar=4*beat
              half=beat//2
              quarter=max(1,beat//4)
              rng=random.Random(_seed_for(cfg,part,section_index))
              tonic,mode=cfg['tonic'],cfg['scale']
              progression=cfg['progression']
              hooks=cfg.get('hooks') or _distinct_hooks(cfg['motif'])
              motif=(hooks['b'] if section_index in (5,6) else hooks['bridge'] if section_index==4 else hooks['a'])
              energy=[0.38,0.64,0.76,0.92,0.33,0.74,0.91,0.28][section_index] * cfg.get('energy',0.8)
              out=[]
              def emit(pos,length,key,velocity):
                  out.append(note(channel,pos,length,key,velocity))
              for b in range(bars):
                  start=b*bar
                  degree=progression[(b//2 + section_index)%4]
                  root=_semid(tonic,mode,degree)
                  gentle=section_index in (0,4,7)
                  if part=='kick':
                      # One Drop: third beat ONLY. In breaks the groove stays soft.
                      emit(start+2*beat,max(1,int(.30*beat)),60,_velocity_curve(84 if gentle else 101,b,'reggae'))
                  elif part=='snare':
                      # Snare or rimshot shares the kick's third beat.
                      emit(start+2*beat,max(1,int(.28*beat)),60,_velocity_curve(75 if gentle else 99,b,'reggae'))
                  elif part=='hat':
                      # Upbeat eighths with velocity movement; never a constant 16th techno roll.
                      for k in range(4):
                          off=start+k*beat+half
                          emit(off,max(1,int(.22*beat)),60,50+rng.randint(0,13)+(8 if k==2 else 0))
                          if not gentle and b%2==1 and k in (1,3):
                              emit(start+k*beat,max(1,int(.13*beat)),60,35+rng.randint(0,9))
                  elif part=='bass':
                      # Roots on one, and the anticipated 'and of two/and of four'.
                      key=max(0,min(127,36+root))
                      # 4-bar bass phrases: roots, rests, pickup / cadence. The groove
                      # remains syncopated and intentionally leaves space for the kick.
                      emit(start,max(1,int((1.15 if b%4==3 else 1.35)*beat)),key,
                           _velocity_curve(80 if gentle else 97,b,'reggae'))
                      if not gentle:
                          if b%4 in (0,2):
                              emit(start+beat+half,max(1,int(.60*beat)),key,88)
                          elif b%4==1:
                              emit(start+2*beat+half,max(1,int(.55*beat)),key+7,80)
                          if b%4==3:
                              next_degree=progression[((b//2)+1+section_index)%4]
                              approach=max(0,min(127,36+_semid(tonic,mode,next_degree)))
                              emit(start+3*beat+half,max(1,int(.37*beat)),approach,81)
                      elif b%2:
                          emit(start+3*beat+half,max(1,int(.35*beat)),key+7,56)
                  elif part=='pad':
                      # Guitar/keys skank: staccato chords on EVERY offbeat.
                      # A pre-recorded chord sample may not transpose reliably; report this to users.
                      if section_index not in (0,7):
                          for k in range(4):
                              if gentle and k in (0,2):
                                  continue
                              pos=start+k*beat+half
                              for d in (degree,degree+2,degree+4):
                                  emit(pos,max(1,int(.18*beat)),60+_semid(tonic,mode,d),66 if gentle else 79+(k==2)*6)
                  elif part=='arp':
                      # Reggae organ bubble: light repeated offbeats and an occasional
                      # slightly earlier 16th pickup into the next upbeat, not EDM arpeggios.
                      if section_index not in (0,7):
                          for k in (0,1,2,3):
                              if gentle and k%2==1:continue
                              pos=start+k*beat+half
                              for d in (degree,degree+2,degree+4):
                                  emit(pos,max(1,int(.16*beat)),60+_semid(tonic,mode,d),56 if gentle else 69)
                              if not gentle and k in (1,3) and b%2==0:
                                  emit(start+k*beat+quarter,max(1,int(.11*beat)),60+_semid(tonic,mode,degree+2),48)
                  elif part=='lead':
                      # Spacious, singable melodic phrasing, often answering the skank.
                      if gentle:
                          if b%2==0:
                              d=motif[(b//2)%8]
                              emit(start+beat+half,max(1,int(1.2*beat)),60+_semid(tonic,mode,(d+degree)%7),71)
                      else:
                          for k in (0,2,3):
                              if k==3 and b%2==0:continue
                              d=motif[(2*b+k+section_index+(b//4)*2)%8]
                              if b%4==3 and k==3:
                                  d=motif[0]  # 4-bar cadence
                              elif (b//4)%2 and k==2:
                                  d=min(13,d+2)  # response instead of copied riff
                              pos=start+k*beat+(half if k in (0,3) else 0)
                              emit(pos,max(1,int((.85 if b%4==3 else .60)*beat)),60+_semid(tonic,mode,(d+degree)%7),
                                   _velocity_curve(72+rng.randint(0,13),b,'reggae'))
              return out
          
          
          
          def _modern_frenchcore_notes(part, sec, bars, ppq, cfg, channel):
              """Modern-style MIDI draft with contrasting phrases and sectional dynamics.
          
              A: hook, B: answer, C: lift, D: altered cadence. Every four bars develop
              the motif with a deliberate variation; final drop adds a countermelody.
              Never promises final contemporary sound design from one-shot samples.
              """
              beat=ppq
              bar=beat*4
              eighth=max(1,beat//2)
              sixteenth=max(1,beat//4)
              # The break and the two drops now own distinct, model-proposed themes.
              hooks=cfg.get('hooks') or _distinct_hooks(cfg['motif'])
              motif=(hooks['b'] if sec==6 else hooks['bridge'] if sec==4 else hooks['a'])
              progression=cfg['progression']
              tonic,mode=cfg['tonic'],cfg['scale']
              rng=random.Random(_seed_for(cfg,part,sec))
              out=[]
              def emit(pos,length,key,vel,pan=64):
                  n=note(channel,pos,max(1,int(length)),key,max(1,min(128,int(vel))))
                  n['pan']=pan
                  out.append(n)
          
              for b in range(bars):
                  start=b*bar
                  phrase=b//4
                  phrase_pos=b%4
                  eight=b%8
                  last=b==bars-1
                  drop=sec in (3,6)
                  build=sec in (2,5)
                  teaser=sec==1
                  emotional=sec==4
                  intro=sec==0
                  outro=sec==7
                  # Genuine four-chord movement: V0.7 mistakenly used (phrase*4)%4,
                  # locking the progression to one chord for an entire section.
                  step=(b + (2 if sec==6 else 0))%4
                  degree=progression[step]
                  root=_semid(tonic,mode,degree)
                  bass=36+root
                  # Last 1/2 bar of a build is a breathing gap before the drop.
                  empty_at_end=build and last
          
                  if part=='kick':
                      if drop:
                          hits=(0,1,2,3)
                      elif build:
                          hits=(0,2) if b<bars*.45 else (0,1,2,3)
                      elif teaser:
                          hits=(0,2) if b%2==0 else (0,)
                      elif outro:
                          hits=(0,2) if b<bars//2 else (0,)
                      else:
                          hits=()
                      for k in hits:
                          if empty_at_end and k>=2:continue
                          emit(start+k*beat,round(.26*beat),60,
                               _velocity_curve(106 if k==0 else 99,b))
          
                  elif part=='snare':
                      if drop or teaser:
                          for k in (1,3):
                              emit(start+k*beat,round(.20*beat),60,_velocity_curve(83 if k==1 else 96,b))
                          if drop and phrase_pos==3 and not last:
                              # A fill only at the end of phrases, not a 16th-note loop.
                              for k in (0,1):
                                  emit(start+3*beat+eighth+k*sixteenth,
                                       round(.10*beat),60,58+8*k)
                      elif build:
                          for k in (1,3):
                              if empty_at_end and k==3:continue
                              emit(start+k*beat,round(.18*beat),60,83)
                          if b>=bars//2:
                              step=eighth if b<bars-2 else sixteenth
                              for pos in range(2*beat,bar,step):
                                  if empty_at_end and pos>=2*beat:continue
                                  emit(start+pos,max(1,round(step*.18)),60,
                                       49+int(32*pos/bar))
                      elif outro and b%2==0:
                          emit(start+3*beat,round(.20*beat),60,61)
          
                  elif part=='hat':
                      if drop:
                          for k in range(8):
                              # Alternate open/closed slots and remove some hits on downbeat.
                              if k%2 or (phrase%2==0 and k in (0,4)) or (sec==6 and k in (2,6)):
                                  vel=47+10*(k%2)+rng.randrange(12)
                                  emit(start+k*eighth,round(.19*eighth),60,_velocity_curve(vel,b))
                          if phrase_pos==3 and not last:
                              for k in (12,13,14,15):
                                  emit(start+k*sixteenth,round(.13*sixteenth),60,42+k)
                      elif build:
                          step=eighth if b<bars-2 else sixteenth
                          for pos in range(0,bar,step):
                              if empty_at_end and pos>=2*beat:continue
                              emit(start+pos,round(.16*step),60,42+rng.randrange(18))
                      elif teaser:
                          for k in (1,3,5,7):
                              if (phrase%2 or k!=5):emit(start+k*eighth,round(.20*eighth),60,47+rng.randrange(16))
                      elif outro and b%2==0:
                          for k in (1,5):emit(start+k*eighth,round(.18*eighth),60,39)
          
                  elif part=='bass':
                      if drop:
                          # Phrases vary across four-bar blocks, with pickups and rests.
                          slots=((0.5,1.5,2.5,3.5) if phrase_pos in (0,2) else
                                 (0.5,1.75,2.5) if phrase_pos==1 else
                                 (0.5,1.5,3.25))
                          for i,k in enumerate(slots):
                              jump=7 if sec==6 and i==len(slots)-1 else (12 if phrase_pos==3 and i==len(slots)-1 else 0)
                              emit(start+round(k*beat),round(.29*beat),bass+jump,
                                   _velocity_curve(80+(i==0)*8,b))
                      elif teaser:
                          for at in (0.5,2.5):emit(start+round(at*beat),round(.42*beat),bass,75)
                      elif build:
                          if not empty_at_end:
                              for at in ((0.5,2.5) if b<bars//2 else (0.5,1.5,2.5)):
                                  emit(start+round(at*beat),round(.33*beat),bass,70)
                      elif emotional and b%2==0:
                          emit(start,round(1.65*beat),bass,66)
          
                  elif part=='lead':
                      if drop or teaser:
                          # Four-bar sentences: call, response, variation, cadence.
                          rhythm=_rhythm_shape(cfg,sec,phrase_pos)
                          if teaser: rhythm=rhythm[::2]
                          for i,at in enumerate(rhythm):
                              idx=(i + phrase_pos*2 + phrase*3)%8
                              md=motif[idx]
                              # Transform every second phrase in the SAME drop; not copied 4-bar loops.
                              if phrase%2==1 and i in (1,3): md=min(13,md+2)
                              if sec==6:
                                  md=min(13,md+(1 if i%2==0 else 2))
                              if phrase_pos==3 and i==len(rhythm)-1:
                                  md=0  # chord-relative cadence, resolved rather than wandering
                              # Resolve relative motif degree against the active chord.
                              chord_note=60+_semid(tonic,mode,(md+degree)%7)+(12 if md>=7 else 0)
                              dur=.48 if at%1 else .62
                              emit(start+round(at*beat),round(dur*beat),chord_note,
                                   _velocity_curve(78+rng.randrange(12),b))
                      elif emotional:
                          if b%2==0:
                              idx=((b//2)+sec)%8
                              emit(start,round(1.90*beat),60+_semid(tonic,mode,(motif[idx]+degree)%7),71)
                              emit(start+round(2.5*beat),round(1.05*beat),
                                   60+_semid(tonic,mode,(motif[(idx+2)%8]+degree)%7),66)
                      elif build:
                          if not empty_at_end:
                              for i in range(2 if b<bars//2 else 4):
                                  at=(.5+2*i if b<bars//2 else i)
                                  md=motif[(i+b+sec+phrase)%8]
                                  emit(start+round(at*beat),round(.36*beat),60+_semid(tonic,mode,(md+degree)%7),71+3*i)
                      elif intro and b%2==0:
                          emit(start+round(2*beat),round(1.15*beat),60+_semid(tonic,mode,(motif[(b//2)%8]+degree)%7),64)
          
                  elif part=='pad':
                      if b%2==0 and not (outro and b>=bars//2):
                          # Chord stabs in energetic sections; long pads in the breaks.
                          duration=(1.90 if intro or emotional else 1.15 if drop else 1.60)*bar
                          vel=61 if intro or emotional else 54 if drop else 56
                          for d in (degree,degree+2,degree+4):
                              emit(start,round(duration),48+_semid(tonic,mode,d),vel)
          
                  elif part=='arp':
                      if drop:
                          # Antiphonal riff answers the lead, differs in drop B.
                          rhythm=(.5,1.5,2.5,3.5) if sec==3 else (.25,1.25,2.75,3.5)
                          for i,at in enumerate(rhythm):
                              if phrase_pos==3 and i==1:continue
                              d=degree+(0,2,4,2)[(i+phrase)%4]
                              emit(start+round(at*beat),round(.24*beat),60+_semid(tonic,mode,d),
                                   _velocity_curve(50+rng.randrange(15),b),
                                   pan=75 if sec==3 else 54)
                      elif build:
                          if not empty_at_end:
                              count=2 if b<bars//2 else 4
                              for i in range(count):
                                  at=(i*4/count+.5)*beat
                                  d=degree+(0,2,4,2)[i]
                                  emit(start+round(at),round(.27*beat),60+_semid(tonic,mode,d),53+rng.randrange(12))
                      elif intro and phrase_pos==3:
                          emit(start+round(3*beat),round(.5*beat),60+_semid(tonic,mode,degree+4),49)
              return out
          
          
          def _reggae_disco_notes(part, sec, bars, ppq, cfg, channel):
              """Faster crossover: 2/4 backbeat, syncopated bass, offbeat skank.
              Does not pretend to reproduce any particular commercial song.
              """
              if part not in ('kick','snare','hat'):
                  return _reggae_section_notes(part,sec,bars,ppq,cfg,channel)
              beat=ppq; bar=ppq*4; half=max(1,ppq//2)
              out=[];rng=random.Random(_seed_for(cfg,part,sec))
              for b in range(bars):
                  base=b*bar; gentle=sec in (0,4,7)
                  if part=='kick':
                      hits=(0,2) if gentle else (0,1.5,2,3.5)
                      for at in hits:
                          out.append(note(channel,base+round(at*beat),round(.3*beat),60,90 if gentle else 105))
                  elif part=='snare':
                      for at in ((3,) if gentle else (1,3)):
                          out.append(note(channel,base+round(at*beat),round(.25*beat),60,78 if gentle else 98))
                      if sec in (2,5) and b==bars-1:
                          for k in range(4):
                              out.append(note(channel,base+3*beat+k*max(1,beat//4),round(.13*beat),60,65+8*k))
                  else:
                      for k in range(8):
                          if gentle and k%2==0: continue
                          out.append(note(channel,base+k*half,round(.22*beat),60,47+rng.randrange(22)))
              return out
          
          def _hiphop_section_notes(part, section_index, bars, ppq, cfg, channel):
              """Boom-bap/trap starter skeleton: halftime snares, syncopated kick and hats."""
              if part not in ('kick','snare','hat'):
                  return None
              beat=ppq;bar=4*beat;out=[]
              rng=random.Random(1900+section_index*13+sum(map(ord,part)))
              for b in range(bars):
                  start=b*bar
                  if part=='kick':
                      for x in (0, int(1.5*beat), int(2.75*beat)):
                          if x>0 and section_index in (0,4,7):continue
                          out.append(note(channel,start+x,int(.25*beat),60,96))
                  elif part=='snare':
                      for x in (beat,3*beat):
                          out.append(note(channel,start+x,int(.3*beat),60,92))
                  else:
                      for j in range(8):
                          if section_index in (0,4,7) and j%2:continue
                          out.append(note(channel,start+j*(beat//2),int(.13*beat),60,48+rng.randrange(22)))
              return out
          
          def section_notes(part, section_index, bars, ppq, cfg, channel):
              """Procedural MIDI: style rules take precedence over generic four-on-the-floor."""
              if cfg.get('style') == 'reggae':
                  if cfg.get('groove') == 'reggae_disco':
                      return _reggae_disco_notes(part,section_index,bars,ppq,cfg,channel)
                  return _reggae_section_notes(part,section_index,bars,ppq,cfg,channel)
              if cfg.get('style') == 'frenchcore':
                  return _modern_frenchcore_notes(part,section_index,bars,ppq,cfg,channel)
              if cfg.get('style') == 'hiphop':
                  hiphop = _hiphop_section_notes(part,section_index,bars,ppq,cfg,channel)
                  if hiphop is not None:
                      return hiphop
              beat = ppq
              bar = 4*beat
              rng=random.Random(4021+section_index*77+sum(map(ord,part)))
              prog=cfg["progression"]
              motif=cfg["motif"]
              tonic,mode=cfg["tonic"],cfg["scale"]
              # Intro, theme, build, drop, break, re-build, final drop, outro.
              density=[0.27,0.65,0.75,1.0,0.32,0.77,1.0,0.23][section_index]
              out=[]
              def emit(pos,dur,key,vel):out.append(note(channel,pos,dur,key,vel))
              for b in range(bars):
                  start=b*bar
                  deg=prog[(b//2+section_index)%4]
                  root=_semid(tonic,mode,deg)
                  # The kick and snare are sample one-shots (key 60).
                  if part=="kick":
                      if section_index in (0,4,7):
                          hits=[0,2] if b%2==0 else [0]
                      else:
                          hits=[0,1,2,3]
                      for i in hits:emit(start+i*beat,int(beat*.28),60,104 if i==0 else 98)
                  elif part=="snare":
                      if density>.55:
                          for k in (1,3):emit(start+k*beat,int(beat*.24),60,88 if k==1 else 104)
                      elif b%2==1:emit(start+3*beat,int(beat*.24),60,80)
                  elif part=="hat":
                      step=beat//2 if density>.6 else beat
                      for pos in range(0,bar,step):
                          if rng.random() < density*.86:
                              emit(start+pos,max(1,step//3),60,53+rng.randrange(24))
                  elif part=="bass":
                      bass_root=36+root  # A2 ~= 45
                      if section_index in (0,4,7):
                          emit(start,int(beat*2),bass_root,75)
                          if b%2==0:emit(start+2*beat,beat,bass_root+12,65)
                      else:
                          for k in range(4):
                              key=bass_root+(12 if k==3 and b%4==3 else 0)
                              emit(start+k*beat,int(beat*.78),key,90+(k==0)*9)
                  elif part=="lead":
                      if section_index in (0,7):
                          if b%2==0:
                              idx=(b//2)%8
                              emit(start,int(beat*2),60+_semid(tonic,mode,motif[idx]),80)
                      elif section_index==4:
                          for k in (0,2):
                              emit(start+k*beat,int(beat*1.5),60+_semid(tonic,mode,motif[(b*2+k)%8]),74)
                      else:
                          for k in range(8):
                              if density<.85 and k in (1,5) and b%2==1:continue
                              degree=motif[(k + (b%4)*2)%8]
                              if section_index in (3,6) and b%8==7 and k>4:degree+=2
                              emit(start+k*(beat//2),max(1,int(beat*.43)),60+_semid(tonic,mode,degree),
                                   86+rng.randrange(22))
                  elif part=="pad":
                      for d in (deg,deg+2,deg+4):
                          emit(start,int(bar*.95),48+_semid(tonic,mode,d),65 if section_index in (0,4,7) else 74)
                  elif part=="arp":
                      if section_index not in (0,4,7):
                          for k in range(8):
                              if density<.9 and (k%2==1):continue
                              d=deg + (0,2,4,7,4,2,4,2)[k]
                              emit(start+k*(beat//2),max(1,int(beat*.32)),60+_semid(tonic,mode,d),65+rng.randrange(25))
              return out
          
          
          def make_drum_samples():
              base = Path(os.getenv("LOCALAPPDATA") or (Path.home()/".lemon_composer")) / "Lemon Studio AI" / "Generated Samples"
              base.mkdir(parents=True, exist_ok=True)
              sr=44100
              paths={}
              for kind,length in (("kick",.50),("snare",.29),("hat",.14)):
                  path=base/(kind+"-v1.wav")
                  if path.exists() and path.stat().st_size>1000:
                      paths[kind]=str(path);continue
                  rnd=random.Random({"kick":17,"snare":29,"hat":41}[kind]);last=0.0;phase=0.0;samples=[]
                  n=int(sr*length)
                  for i in range(n):
                      t=i/sr;noise=rnd.uniform(-1,1)
                      if kind=="kick":
                          hz=49+165*math.exp(-t*35)
                          phase+=2*math.pi*hz/sr
                          env=math.exp(-t*8)
                          click=0.20*noise*math.exp(-t*180)
                          signal=math.tanh(2.8*(math.sin(phase)*env+click))*.78
                      elif kind=="snare":
                          last=0.86*last+0.14*noise
                          high=noise-last
                          signal=(high*.79+math.sin(2*math.pi*186*t)*.20)*math.exp(-t*21)*.80
                      else:
                          last=0.95*last+0.05*noise
                          high=noise-last
                          signal=high*math.exp(-t*40)*.52
                      samples.append(struct.pack("<h",round(max(-1,min(1,signal))*32767)))
                  with wave.open(str(path),"wb") as wav:
                      wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(sr);wav.writeframes(b"".join(samples))
                  paths[kind]=str(path)
              return paths
          
          
          def _apply(rpc, commands, label, steps):
              if not commands:return []
              data=rpc.call("apply", commands=commands, name="Lemon Composer : "+label)
              if not isinstance(data,dict) or not isinstance(data.get("results"),list) or len(data["results"])!=len(commands):
                  raise RuntimeError("Réponse inattendue du moteur de Lemon Studio")
              steps.append(label)
              return data["results"]
          
          
          
          def composer_channel_roles(state):
              """Only identify channels explicitly named by this assistant, never arbitrary user tracks."""
              found={}
              for ch in state.get('channels',[]):
                  if not isinstance(ch,dict) or type(ch.get('id')) is not int:
                      continue
                  name=ch.get('name')
                  if not isinstance(name,str):continue
                  for role,label in ROLE_NAMES.items():
                      if name.startswith(label+' · '):
                          found[ch['id']]=role
                          break
              return found
          
          
          def rebalance_project(rpc):
              """Rebalance existing V0.4/V0.5 composer channels in one undoable step.
              Read-only sample library. Requires explicit confirmation in the UI.
              """
              roles=composer_channel_roles(rpc.call('state'))
              if not roles:
                  raise ValueError('Aucun canal créé par le compositeur (nom « Kick · ... ») trouvé dans le projet ouvert.')
              commands=[{'op':'set_main_volume','volume':0.8}]
              for cid,role in roles.items():
                  commands.append({'op':'set_channel','channel':cid,
                                   'volume':_gain_from_db(CHANNEL_ATTENUATION_DB[role],0.78125)})
              reply=rpc.call('apply',commands=commands,name='Lemon Composer : reequilibrage V0.6')
              if not isinstance(reply,dict) or len(reply.get('results',[]))!=len(commands):
                  raise RuntimeError('Reponse du moteur incorrecte apres le reequilibrage : verifier historique avant de continuer')
              return len(roles)
          
          def build_song(rpc, cfg, report, *, rollback=True, chosen_samples=None, pack_only=True):
              """One accepted user request, many dependent RPC steps; roll back our own steps if a phase fails."""
              ppq=int(rpc.call("state").get("ppq") or 96)
              if not 24<=ppq<=1920:
                  raise RuntimeError("Résolution temporelle du projet non prise en charge")
              chosen_samples = dict(chosen_samples or {})
              for role,path in chosen_samples.items():
                  if role not in ROLE_ORDER or not Path(path).is_file():
                      raise ValueError("Sample introuvable ou rôle inconnu : " + str(path))
              if pack_only and not chosen_samples:
                  raise ValueError("Aucun sample du pack ne convient aux catégories demandées.")
              report("Utilisation des samples de tes packs...",0)
              samples=dict(chosen_samples)
              if not pack_only:
                  missing_drums = [r for r in PERCUSSIVE if r not in samples]
                  if missing_drums:
                      generated=make_drum_samples()
                      samples.update({r:generated[r] for r in missing_drums})
              active_parts = [r for r in ROLE_ORDER if (r in samples or not pack_only)]
              needed=[r for r in active_parts if r not in samples]
              if needed:
                  plugins=rpc.call('plugins')
                  available=set(plugins.get('instruments',[]))
                  missing={'Citrus' if r in ('lead','pad') else 'Lemon Trio' for r in needed}-available
                  if missing:
                      raise RuntimeError('Instrument(s) de secours indisponible(s) : '+', '.join(missing))
              total=cfg["bars"]
              segments=modern_section_lengths(total,cfg.get('style'))
              names=modern_section_labels(cfg)
              steps=[]
              try:
                  report("Création du tempo et des instruments...",3)
                  init=[{"op":"set_tempo","bpm":cfg["bpm"]},{"op":"set_time_signature","numerator":4,"denominator":4},
                        {"op":"set_info","title":cfg["title"]}]
                  for part in active_parts:
                      data={"op":"add_channel","name":ROLE_NAMES[part]}
                      if part in samples:
                          data["sample"]=samples[part]
                          data["name"]=(ROLE_NAMES[part]+" · "+Path(samples[part]).stem)[:64]
                      else:
                          data["plugin"]="Citrus" if part in ("lead","pad") else "Lemon Trio"
                      init.append(data)
                  results=_apply(rpc,init,"Instruments et tempo",steps)
                  ids={role:int(result["channel"]) for role,result in zip(active_parts,results[3:])}
                  # Attenuate normalized professional samples BEFORE mixing together.
                  levels=[{'op':'set_main_volume','volume':_gain_from_db(MASTER_ATTENUATION_DB,0.8)}]
                  levels += [{'op':'set_channel','channel':ids[part],
                              'volume':_gain_from_db(_sample_audio_gain(part,samples.get(part),cfg),0.78125)}
                             for part in active_parts]
                  for k in range(0,len(levels),8):
                      _apply(rpc,levels[k:k+8],"Protection de niveau audio",steps)
                  report("Préparation des effets Lemon Studio et protection des queues audio...",4)
                  effects=apply_builtin_effects(rpc,ids,samples,steps,report)
                  position=0
                  last_trigger={}
                  overlaps_removed=0
                  pat_count=0
                  nt_count=0
                  for sec,(name,bars) in enumerate(zip(names,segments)):
                      report(f"Composition de {name} ({sec+1}/8)" +
                             (" — entrée progressive des instruments..." if cfg.get('style')=='frenchcore' and sec==1 else "..."),
                             8+int(sec*10.6))
                      patterns=[]
                      for part in active_parts:
                          notes=section_notes(part,sec,bars,ppq,cfg,ids[part])
                          notes=_phrase_arrange(notes,part,sec,bars,ppq,cfg)
                          notes=_stage_frenchcore_teaser(part,sec,notes,bars,ppq,cfg)
                          if notes and part in samples:
                              before=len(notes)
                              notes=sample_safe_notes(part,notes,samples[part],bpm=cfg['bpm'],ppq=ppq)
                              overlaps_removed+=before-len(notes)
                              notes,removed=_suppress_ambience_overlap(notes,part,samples[part],cfg['bpm'],ppq,position,last_trigger)
                              overlaps_removed+=removed
                          # Keep sustained notes inside the intended section, including
                          # the breaks; samples themselves are never edited or trimmed.
                          end=bars*4*ppq
                          notes=[{**n,'length':min(n['length'],end-n['position'])}
                                 for n in notes if 0<=n['position']<end]
                          if notes:
                              patterns.append((part,notes))
                      cmds=[{"op":"add_pattern","name":f"{name} • {ROLE_NAMES[part]}"} for part,_ in patterns]
                      prs=[]
                      for k in range(0,len(cmds),8):prs+=_apply(rpc,cmds[k:k+8],f"{name} - patterns",steps)
                      all_note_cmds=[]
                      for (part,notes),result in zip(patterns,prs):
                          patid=int(result["pattern"])
                          pat_count+=1
                          # Batches of 48 notes and at most 4 commands per RPC transaction.
                          for k in range(0,len(notes),48):
                              all_note_cmds.append({"op":"add_notes","pattern":patid,"notes":notes[k:k+48]})
                          nt_count+=len(notes)
                      for k in range(0,len(all_note_cmds),4):
                          _apply(rpc,all_note_cmds[k:k+4],f"{name} - notes MIDI",steps)
                      clips=[]
                      for (part,_),result in zip(patterns,prs):
                          clips.append({"op":"add_clip","track":active_parts.index(part)+1,
                                        "position":position,"length":bars*4*ppq,"pattern":int(result["pattern"])})
                      for k in range(0,len(clips),8):_apply(rpc,clips[k:k+8],f"{name} - playlist",steps)
                      position+=bars*4*ppq
                  report("Composition créée ! Sauvegarde ton projet depuis Lemon Studio.",100)
                  return {"bars":total,"seconds":cfg["seconds"],"patterns":pat_count,"notes":nt_count,"steps":len(steps),"chosen_samples":{r:samples[r] for r in active_parts if r in samples},"missing_roles":[r for r in ROLE_ORDER if r not in active_parts],"effects":effects,"overlaps_avoided":overlaps_removed}
              except Exception as exc:
                  if rollback and steps:
                      report("Erreur détectée : tentative d'annulation des modifications...",0)
                      errors=[]
                      for _ in reversed(steps):
                          try:rpc.call("undo")
                          except Exception as e:errors.append(str(e));break
                      if errors:
