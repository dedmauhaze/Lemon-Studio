name: Lemon Studio FR + Compositeur IA Ollama - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lemon-composer.yml'

permissions:
  contents: read
  actions: read

jobs:
  composer-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Recuperer la version francaise qui fonctionne
        uses: actions/download-artifact@v4
        with:
          name: Lemon-Studio-Windows-x64-FR
          run-id: 41723186509
          github-token: ${{ github.token }}
          repository: dedmauhaze/Lemon-Studio
          path: Lemon-Studio-FR-Composer

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generer et tester l'assistant compositeur
        shell: pwsh
        run: |
          @'
          # -*- coding: utf-8 -*-
          """Lemon Composer: local Ollama musical direction + deterministic, undoable Lemon Studio build.
          No third-party Python dependencies. GPL-3.0-or-later; experimental, independent companion.
          """
          from __future__ import annotations
          import json
          import math
          import os
          from pathlib import Path
          import random
          import re
          import struct
          import urllib.error
          import urllib.request
          import wave
          
          ROLE_ORDER = ("kick", "snare", "hat", "bass", "lead", "pad", "arp")
          ROLE_NAMES = {"kick":"Kick", "snare":"Snare", "hat":"Hi-hat", "bass":"Basse", "lead":"Lead", "pad":"Accords", "arp":"Arpege"}
          TONICS = {"C":0, "C#":1, "DB":1, "D":2, "D#":3, "EB":3, "E":4, "F":5, "F#":6, "GB":6, "G":7, "G#":8, "AB":8, "A":9, "A#":10, "BB":10, "B":11}
          SCALE = {"minor":[0,2,3,5,7,8,10], "major":[0,2,4,5,7,9,11]}
          MAX_BARS = 160
          
          
          def _small(text, limit=80):
              if not isinstance(text, str):
                  return ""
              return "".join(c for c in text if c.isprintable())[:limit].strip()
          
          
          def extract_json(text):
              if not isinstance(text, str):
                  raise ValueError("Réponse du modèle absente")
              idx = text.find("{")
              if idx < 0:
                  raise ValueError("Ollama n'a pas renvoyé le plan JSON attendu")
              try:
                  obj, _ = json.JSONDecoder().raw_decode(text[idx:])
              except json.JSONDecodeError as e:
                  raise ValueError("Le plan musical renvoyé par Ollama n'est pas un JSON valide") from e
              if not isinstance(obj, dict):
                  raise ValueError("Le plan musical doit être un objet JSON")
              return obj
          
          
          def infer_bpm(prompt):
              m = re.search(r"\b(\d{2,3})\s*bpm\b", prompt, re.I)
              return max(60, min(240, int(m.group(1)))) if m else 190 if "frenchcore" in prompt.lower() else 140
          
          
          def infer_seconds(prompt, bpm):
              m = re.search(r"\b(\d{1,2})\s*(?:min(?:utes?)?|mn)\b", prompt.lower())
              if m:
                  return max(30, min(240, int(m.group(1))*60))
              m = re.search(r"\b(\d{2,3})\s*(?:sec(?:ondes?)?|s)\b", prompt.lower())
              if m:
                  return max(30, min(240, int(m.group(1))))
              return 90
          
          
          def plan_from_ollama(prompt, model, state):
              if not model or not isinstance(model, str):
                  raise ValueError("Indique le modèle Ollama (ex. qwen2.5:7b-instruct)")
              sys_prompt = '''Tu es un arrangeur et compositeur musical. Transforme la demande en plan de composition pour un DAW.
          Réponds exclusivement par un objet JSON, sans commentaire et sans markdown:
          {"title":"Frenchcore Odyssey","bpm":200,"tonic":"A","scale":"minor","mood":"épique sombre","progression":[0,5,2,6],"motif":[0,2,4,5,4,2,1,0],"energy":0.8}
          Toutes les valeurs doivent être simples. tonic = C,C#,D,D#,E,F,F#,G,G#,A,A#,B; scale = minor ou major.
          progression = quatre degrés ENTIERs de 0 à 6; motif = huit degrés ENTIERs de 0 à 13.
          Ne renvoie jamais de commandes système, d'instructions, de chemins ni de code. Sélectionne un tempo, une tonalité et un motif adaptés à la demande.'''
              req = {
                  "model": model[:100], "stream": False, "format": "json",
                  "prompt": sys_prompt + "\nDemande de l'utilisateur: " + prompt[:2200] + "\nBPM actuel: " + str(state.get("tempo", "inconnu")),
                  "options": {"temperature": 0.25, "num_predict": 480},
                  "keep_alive": "10m"
              }
              data = json.dumps(req, ensure_ascii=False).encode("utf-8")
              http = urllib.request.Request("http://127.0.0.1:11434/api/generate", data=data, headers={"Content-Type":"application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(http, timeout=180) as response:
                      result = json.loads(response.read(1_000_000).decode("utf-8"))
              except urllib.error.HTTPError as e:
                  detail = e.read(500).decode("utf-8", "replace")
                  raise RuntimeError(f"Ollama HTTP {e.code} : {detail}") from None
              except (urllib.error.URLError, TimeoutError) as e:
                  raise RuntimeError(f"Ollama n'est pas joignable ou le calcul a pris trop de temps : {e}") from None
              return extract_json(result.get("response", ""))
          
          
          def normalize(raw, prompt):
              """Allowlist the model's musical metadata; never translate its output into arbitrary RPC commands."""
              if not isinstance(raw, dict):
                  raise ValueError("Le modèle n'a pas envoyé de plan musical")
              bpm = infer_bpm(prompt)
              # An explicit BPM from the user always wins over the model.
              if not re.search(r"\b\d{2,3}\s*bpm\b", prompt, re.I):
                  try:
                      bpm = max(60, min(240, int(raw.get("bpm", bpm))))
                  except (ValueError, TypeError):
                      pass
              tonic = str(raw.get("tonic", "A")).upper().replace("♯", "#").replace("♭", "B")
              if tonic not in TONICS:
                  tonic = "A"
              scale = str(raw.get("scale", "minor")).lower()
              if scale not in SCALE:
                  scale = "minor"
              def degrees(x, n, fallback, hi):
                  if not isinstance(x, list) or len(x) != n:
                      return fallback
                  if not all(type(a) is int and 0 <= a <= hi for a in x):
                      return fallback
                  return x
              progression = degrees(raw.get("progression"), 4, [0,5,2,6] if scale == "minor" else [0,4,5,3], 6)
              motif = degrees(raw.get("motif"), 8, [0,2,4,5,4,2,1,0], 13)
              energy = raw.get("energy", 0.8)
              if isinstance(energy, bool) or not isinstance(energy, (int,float)) or not math.isfinite(energy):
                  energy = 0.8
              energy = max(0.35,min(1.0,float(energy)))
              seconds = infer_seconds(prompt,bpm)
              bars = max(32, min(MAX_BARS, round((seconds * bpm / 240) / 4) * 4))
              return {"title":_small(raw.get("title"),65) or "Composition automatique", "bpm":bpm, "tonic":tonic,
                      "scale":scale,"progression":progression,"motif":motif,"energy":energy,"bars":bars,
                      "seconds":round(bars*240/bpm),"mood":_small(raw.get("mood"),60) or "énergique"}
          
          
          def section_lengths(total_bars):
              """8 proportional sections, each multiple of 4 bars, sum exactly total_bars."""
              weights = (0.08,0.12,0.12,0.22,0.13,0.12,0.16,0.05)
              chunks = total_bars // 4
              out = [max(1,round(chunks*x)) for x in weights]
              while sum(out)>chunks:
                  idx=max((i for i,v in enumerate(out) if v>1),key=lambda i:out[i],default=None)
                  if idx is None:break
                  out[idx]-=1
              while sum(out)<chunks:
                  i=max(range(len(weights)),key=lambda j:(chunks*weights[j]-out[j],weights[j]))
                  out[i]+=1
              assert sum(out)==chunks
              return [k*4 for k in out]
          
          
          def _semid(tonic, scale, deg):
              sc=SCALE[scale]
              return TONICS[tonic]+sc[deg%7]+12*(deg//7)
          
          
          def note(channel, position,length,key,velocity=100):
              return {"channel":int(channel),"position":int(position),"length":max(1,int(length)),
                      "key":max(0,min(127,int(key))),"velocity":max(1,min(128,int(velocity))),"pan":64}
          
          
          def section_notes(part, section_index, bars, ppq, cfg, channel):
              """Procedural MIDI: model controls key/chords/motif/energy, engine composes sections."""
              beat = ppq
              bar = 4*beat
              rng=random.Random(4021+section_index*77+sum(map(ord,part)))
              prog=cfg["progression"]
              motif=cfg["motif"]
              tonic,mode=cfg["tonic"],cfg["scale"]
              # Intro, theme, build, drop, break, re-build, final drop, outro.
              density=[0.27,0.65,0.75,1.0,0.32,0.77,1.0,0.23][section_index]
              out=[]
              def emit(pos,dur,key,vel):out.append(note(channel,pos,dur,key,vel))
              for b in range(bars):
                  start=b*bar
                  deg=prog[(b//2+section_index)%4]
                  root=_semid(tonic,mode,deg)
                  # The kick and snare are sample one-shots (key 60).
                  if part=="kick":
                      if section_index in (0,4,7):
                          hits=[0,2] if b%2==0 else [0]
                      else:
                          hits=[0,1,2,3]
                      for i in hits:emit(start+i*beat,int(beat*.34),60,115 if i==0 else 104)
                      if section_index in (3,6) and b%4==3:
                          emit(start+int(3.5*beat),int(.2*beat),60,88)
                  elif part=="snare":
                      if density>.55:
                          for k in (1,3):emit(start+k*beat,int(beat*.24),60,88 if k==1 else 104)
                      elif b%2==1:emit(start+3*beat,int(beat*.24),60,80)
                  elif part=="hat":
                      step=beat//2 if density>.6 else beat
                      for pos in range(0,bar,step):
                          if rng.random() < density*.86:
                              emit(start+pos,max(1,step//3),60,53+rng.randrange(24))
                  elif part=="bass":
                      bass_root=36+root  # A2 ~= 45
                      if section_index in (0,4,7):
                          emit(start,int(beat*2),bass_root,75)
                          if b%2==0:emit(start+2*beat,beat,bass_root+12,65)
                      else:
                          for k in range(4):
                              key=bass_root+(12 if k==3 and b%4==3 else 0)
                              emit(start+k*beat,int(beat*.78),key,90+(k==0)*9)
                  elif part=="lead":
                      if section_index in (0,7):
                          if b%2==0:
                              idx=(b//2)%8
                              emit(start,int(beat*2),72+_semid(tonic,mode,motif[idx]),80)
                      elif section_index==4:
                          for k in (0,2):
                              emit(start+k*beat,int(beat*1.5),72+_semid(tonic,mode,motif[(b*2+k)%8]),74)
                      else:
                          for k in range(8):
                              if density<.85 and k in (1,5) and b%2==1:continue
                              degree=motif[(k + (b%4)*2)%8]
                              if section_index in (3,6) and b%8==7 and k>4:degree+=2
                              emit(start+k*(beat//2),max(1,int(beat*.43)),72+_semid(tonic,mode,degree),
                                   86+rng.randrange(22))
                  elif part=="pad":
                      for d in (deg,deg+2,deg+4):
                          emit(start,int(bar*.95),60+_semid(tonic,mode,d),65 if section_index in (0,4,7) else 74)
                  elif part=="arp":
                      if section_index not in (0,4,7):
                          for k in range(8):
                              if density<.9 and (k%2==1):continue
                              d=deg + (0,2,4,7,4,2,4,2)[k]
                              emit(start+k*(beat//2),max(1,int(beat*.32)),72+_semid(tonic,mode,d),65+rng.randrange(25))
              return out
          
          
          def make_drum_samples():
              base = Path(os.getenv("LOCALAPPDATA") or (Path.home()/".lemon_composer")) / "Lemon Studio AI" / "Generated Samples"
              base.mkdir(parents=True, exist_ok=True)
              sr=44100
              paths={}
              for kind,length in (("kick",.50),("snare",.29),("hat",.14)):
                  path=base/(kind+"-v1.wav")
                  if path.exists() and path.stat().st_size>1000:
                      paths[kind]=str(path);continue
                  rnd=random.Random({"kick":17,"snare":29,"hat":41}[kind]);last=0.0;phase=0.0;samples=[]
                  n=int(sr*length)
                  for i in range(n):
                      t=i/sr;noise=rnd.uniform(-1,1)
                      if kind=="kick":
                          hz=49+165*math.exp(-t*35)
                          phase+=2*math.pi*hz/sr
                          env=math.exp(-t*8)
                          click=0.20*noise*math.exp(-t*180)
                          signal=math.tanh(2.8*(math.sin(phase)*env+click))*.78
                      elif kind=="snare":
                          last=0.86*last+0.14*noise
                          high=noise-last
                          signal=(high*.79+math.sin(2*math.pi*186*t)*.20)*math.exp(-t*21)*.80
                      else:
                          last=0.95*last+0.05*noise
                          high=noise-last
                          signal=high*math.exp(-t*40)*.52
                      samples.append(struct.pack("<h",round(max(-1,min(1,signal))*32767)))
                  with wave.open(str(path),"wb") as wav:
                      wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(sr);wav.writeframes(b"".join(samples))
                  paths[kind]=str(path)
              return paths
          
          
          def _apply(rpc, commands, label, steps):
              if not commands:return []
              data=rpc.call("apply", commands=commands, name="Lemon Composer : "+label)
              if not isinstance(data,dict) or not isinstance(data.get("results"),list) or len(data["results"])!=len(commands):
                  raise RuntimeError("Réponse inattendue du moteur de Lemon Studio")
              steps.append(label)
              return data["results"]
          
          
          def build_song(rpc, cfg, report, *, rollback=True):
              """One accepted user request, many dependent RPC steps; roll back our own steps if a phase fails."""
              ppq=int(rpc.call("state").get("ppq") or 96)
              if not 24<=ppq<=1920:
                  raise RuntimeError("Résolution temporelle du projet non prise en charge")
              report("Préparation des échantillons de batterie...",0)
              samples=make_drum_samples()
              plugins=rpc.call("plugins")
              available=set(plugins.get("instruments",[]))
              if not {"Citrus","Lemon Trio"} <= available:
                  raise RuntimeError("Citrus ou Lemon Trio est introuvable dans les instruments intégrés de cette version")
              total=cfg["bars"]
              segments=section_lengths(total)
              names=("Intro","Thème","Montée","Drop 1","Break","Relance","Drop final","Outro")
              steps=[]
              try:
                  report("Création du tempo et des instruments...",3)
                  init=[{"op":"set_tempo","bpm":cfg["bpm"]},{"op":"set_time_signature","numerator":4,"denominator":4},
                        {"op":"set_info","title":cfg["title"]}]
                  for part in ROLE_ORDER:
                      data={"op":"add_channel","name":ROLE_NAMES[part]}
                      if part in samples:data["sample"]=samples[part]
                      else:data["plugin"]="Citrus" if part in ("lead","pad") else "Lemon Trio"
                      init.append(data)
                  results=_apply(rpc,init,"Instruments et tempo",steps)
                  ids={role:int(result["channel"]) for role,result in zip(ROLE_ORDER,results[3:])}
                  position=0
                  pat_count=0
                  nt_count=0
                  for sec,(name,bars) in enumerate(zip(names,segments)):
                      report(f"Composition de {name} ({sec+1}/8)...",8+int(sec*10.6))
                      patterns=[]
                      for part in ROLE_ORDER:
                          notes=section_notes(part,sec,bars,ppq,cfg,ids[part])
                          if notes:
                              patterns.append((part,notes))
                      cmds=[{"op":"add_pattern","name":f"{name} • {ROLE_NAMES[part]}"} for part,_ in patterns]
                      prs=[]
                      for k in range(0,len(cmds),8):prs+=_apply(rpc,cmds[k:k+8],f"{name} - patterns",steps)
                      all_note_cmds=[]
                      for (part,notes),result in zip(patterns,prs):
                          patid=int(result["pattern"])
                          pat_count+=1
                          # Batches of 48 notes and at most 4 commands per RPC transaction.
                          for k in range(0,len(notes),48):
                              all_note_cmds.append({"op":"add_notes","pattern":patid,"notes":notes[k:k+48]})
                          nt_count+=len(notes)
                      for k in range(0,len(all_note_cmds),4):
                          _apply(rpc,all_note_cmds[k:k+4],f"{name} - notes MIDI",steps)
                      clips=[]
                      for (part,_),result in zip(patterns,prs):
                          clips.append({"op":"add_clip","track":ROLE_ORDER.index(part)+1,
                                        "position":position,"length":bars*4*ppq,"pattern":int(result["pattern"])})
                      for k in range(0,len(clips),8):_apply(rpc,clips[k:k+8],f"{name} - playlist",steps)
                      position+=bars*4*ppq
                  report("Composition créée ! Sauvegarde ton projet depuis Lemon Studio.",100)
                  return {"bars":total,"seconds":cfg["seconds"],"patterns":pat_count,"notes":nt_count,"steps":len(steps)}
              except Exception as exc:
                  if rollback and steps:
                      report("Erreur détectée : tentative d'annulation des modifications...",0)
                      errors=[]
                      for _ in reversed(steps):
                          try:rpc.call("undo")
                          except Exception as e:errors.append(str(e));break
                      if errors:
                          raise RuntimeError(f"{exc} | Annulation incomplète : {errors[0]}. Vérifie l'historique dans Lemon Studio") from exc
                  raise
          
          
          def self_test():
              p=normalize({"title":"Test","progression":[0,5,2,6],"motif":[0,2,4,5,4,2,1,0]},"fais 3 minutes de Frenchcore à 200 BPM")
              assert p["bpm"]==200 and p["bars"]>=120
              assert sum(section_lengths(p["bars"]))==p["bars"]
              assert all(b%4==0 for b in section_lengths(p["bars"]))
              for sec,bars in enumerate(section_lengths(p["bars"])):
                  for part in ROLE_ORDER:
                      ns=section_notes(part,sec,bars,96,p,123)
                      assert all(n["channel"]==123 and n["length"]>0 and n["position"]>=0 for n in ns)
              class FakeRpc:
                  def __init__(self):self.uid=100;self.calls=[]
                  def call(self,method,**params):
                      self.calls.append((method,params))
                      if method=="state":return {"ppq":96}
                      if method=="plugins":return {"instruments":["Citrus","Lemon Trio"]}
                      if method=="apply":
                          res=[]
                          for item in params["commands"]:
                              if item["op"] in ("add_channel","add_pattern","add_clip"):
                                  self.uid+=1
                                  res.append({{"add_channel":"channel","add_pattern":"pattern","add_clip":"clip"}[item["op"]]:self.uid})
                              else:res.append(None)
                          return {"results":res}
                      if method=="undo":return {"step":"test"}
                      raise AssertionError(method)
              fake=FakeRpc();small=normalize({},"fais Frenchcore 200 bpm 30 secondes")
              out=build_song(fake,small,lambda msg,percent:None)
              assert out["patterns"]>=16 and out["notes"]>=100 and out["seconds"]>=25
              assert len([1 for x,_ in fake.calls if x=="apply"])>8
              assert not any(c["op"].startswith("delete") for name,kw in fake.calls if name=="apply" for c in kw["commands"])
              print("Lemon Composer: self-tests OK",out)
          
          if __name__=="__main__":self_test()
          '@ | Set-Content -LiteralPath lemon_composer_core.py -Encoding utf8
          @'
          # -*- coding: utf-8 -*-
          """Lemon Studio FR — Assistant IA (preview companion).
          
          Standalone Windows UI bundled using PyInstaller. Launches Lemon Studio
          with a locally authenticated control plane. Compose mode requires user approval once.
          No API key is stored.
          Uses only Python's standard library (including Tkinter).
          """
          from __future__ import annotations
          
          import json
          import os
          import queue
          import re
          import secrets
          import socket
          import subprocess
          import sys
          import threading
          import time
          import unicodedata
          import urllib.error
          import urllib.request
          from pathlib import Path
          from tkinter import BOTH, END, LEFT, RIGHT, X, Y, BooleanVar, StringVar, Tk, Text, ttk, messagebox
          from tkinter.scrolledtext import ScrolledText
          
          import lemon_composer_core as composer
          
          APP_TITLE = "Lemon Studio — Assistant IA & Compositeur (préversion)"
          OPTIONS = ("Sans IA (commandes locales)", "ChatGPT (API OpenAI)", "Claude (API Anthropic)", "Ollama (sur ce PC)")
          DEFAULT_MODELS = {
              OPTIONS[0]: "",
              OPTIONS[1]: "gpt-5-mini",
              OPTIONS[2]: "claude-sonnet-4-6",
              OPTIONS[3]: "qwen2.5:7b-instruct",
          }
          SYSTEM_PROMPT = """Tu es l'assistant d'un logiciel de musique nommé Lemon Studio.
          Réponds en français uniquement et produis EXACTEMENT un objet JSON, sans markdown :
          {"message": "Explication honnête et courte de ce que tu proposes", "commands": [{"op":"set_tempo","bpm":200}]}
          Tu peux proposer au plus 8 commandes. Opérations AUTORISÉES uniquement :
          set_tempo {bpm: nombre de 10 à 522}
          set_swing {swing: nombre de 0 à 1}
          set_time_signature {numerator: entier de 1 à 32, denominator: 2 ou 4 ou 8 ou 16}
          add_channel {name: nom du canal, facultatif} (canal Sampler muet sans échantillon)
          add_pattern {name: nom du pattern, facultatif}
          add_track {} (nouvelle piste de mixeur)
          set_info {title: titre du projet}
          add_notes {pattern: ID EXISTANT, notes: [{channel: ID EXISTANT,position: ticks >= 0,length: ticks > 0,key: 0..127,velocity: 1..128,pan: 0..128}]}.
          Utilise exclusivement des ID présents dans l'état du projet fourni. Ne fabrique jamais d'ID.
          N'utilise JAMAIS de commandes dangereuses, suppression, sauvegarde, ajout d'effets, accès disque ni outil réseau.
          Si un instrument ou pattern doit être créé avant de recevoir des notes, propose d'abord de l'ajouter, puis demande une seconde requête pour ajouter les notes après validation par l'utilisateur.
          N'affirme pas générer de son ni choisir un sample quand tu n'as créé que des pistes/patterns vides.
          Si la demande est impossible avec les opérations autorisées, réponds avec commands = [] et explique clairement la limite.
          L'utilisateur devra confirmer toute proposition dans Lemon Studio; tu ne peux jamais l'appliquer directement.
          """
          
          
          def clean(text: str) -> str:
              return "".join(c for c in unicodedata.normalize("NFKD", text.lower()) if not unicodedata.combining(c))
          
          
          def offline_plan(text: str) -> dict:
              """Small deterministic command subset, no AI or Internet required."""
              t = clean(text)
              commands: list[dict] = []
              bpm = re.search(r"\b(\d{2,3})\s*bpm\b", t)
              if not bpm:
                  bpm = re.search(r"\b(?:tempo|bpm)\s*(?:a|de|sur|=|:)?\s*(\d{2,3})\b", t)
              if bpm:
                  value = int(bpm.group(1))
                  if not 10 <= value <= 522:
                      raise ValueError("Le tempo doit être compris entre 10 et 522 BPM.")
                  commands.append({"op": "set_tempo", "bpm": value})
          
              if re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?(?:piste\s+(?:de\s+)?mixeur|piste\s+mixer|insert\s+mixeur)\b", t):
                  commands.append({"op": "add_track"})
          
              pattern_match = re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?(?:pattern|motif)\s*(?:nomme|appele|:)?\s*([\w -]{0,42})", t)
              if pattern_match:
                  name = pattern_match.group(1).strip(" .,-")
                  commands.append({"op": "add_pattern", **({"name": name.title()} if name else {})})
          
              chan = re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?(?:canal|channel|instrument)\s*(?:nomme|appele|:)?\s*([\w -]{0,42})", t)
              if chan:
                  name = chan.group(1).strip(" .,-")
                  commands.append({"op": "add_channel", **({"name": name.title()} if name else {})})
              elif re.search(r"\b(?:ajout\w*|cre\w*)\s+(?:une?\s+)?kick\b", t):
                  commands.append({"op": "add_channel", "name": "Kick"})
          
              title = re.search(r"\b(?:nomme|renomme|appelle)\s+(?:le\s+)?projet\s+(.{1,64})", text, re.IGNORECASE)
              if title:
                  commands.append({"op": "set_info", "title": title.group(1).strip(" \"'.,")})
          
              if not commands:
                  return {"message": "Mode local : je comprends actuellement le BPM, l'ajout de canaux, de pistes du mixeur, de patterns et le nom du projet. Pour créer des notes ou des arrangements à partir d'une description libre, choisis ChatGPT, Claude ou Ollama.", "commands": []}
              return {"message": "Voici les modifications que je peux proposer sans connexion IA. Un nouveau canal Sampler ne produit pas de son tant que tu ne charges pas de sample.", "commands": commands[:8]}
          
          
          def parse_json_answer(raw: str) -> dict:
              if not isinstance(raw, str):
                  raise ValueError("L'IA n'a pas retourné de texte.")
              stripped = raw.strip()
              start = stripped.find("{")
              if start < 0:
                  raise ValueError("La réponse de l'IA ne contient pas de JSON exploitable.")
              try:
                  obj, _ = json.JSONDecoder().raw_decode(stripped[start:])
              except json.JSONDecodeError as e:
                  raise ValueError("La réponse de l'IA n'est pas un JSON valide.") from e
              if not isinstance(obj, dict):
                  raise ValueError("Réponse IA incorrecte : objet attendu.")
              return obj
          
          
          def _short_str(x, limit=80):
              if not isinstance(x, str) or not x.strip() or len(x) > limit or "\x00" in x or "\n" in x:
                  raise ValueError("Nom ou valeur de texte invalide.")
              return x.strip()
          
          
          def _int(x, mini, maxi):
              if type(x) is not int or not mini <= x <= maxi:
                  raise ValueError(f"Entier requis entre {mini} et {maxi}.")
              return x
          
          
          def _float(x, mini, maxi):
              if isinstance(x, bool) or not isinstance(x, (int, float)) or not mini <= float(x) <= maxi:
                  raise ValueError(f"Nombre requis entre {mini} et {maxi}.")
              return float(x)
          
          
          def validate_commands(plan: dict, state: dict) -> tuple[str, list[dict]]:
              """Hard allowlist. Never pass arbitrary model-generated operations to Lemon Studio."""
              msg = str(plan.get("message", "Proposition de modifications."))[:1200]
              items = plan.get("commands", [])
              if not isinstance(items, list) or len(items) > 8:
                  raise ValueError("L'assistant doit proposer au maximum huit commandes.")
              channel_ids = {int(c["id"]) for c in state.get("channels", []) if isinstance(c, dict) and type(c.get("id")) is int}
              pattern_ids = {int(p["id"]) for p in state.get("patterns", []) if isinstance(p, dict) and type(p.get("id")) is int}
              ppq = int(state.get("ppq") or 96)
              result = []
              for item in items:
                  if not isinstance(item, dict):
                      raise ValueError("Commande non valide.")
                  op = item.get("op")
                  if op == "set_tempo" and set(item) == {"op", "bpm"}:
                      result.append({"op": op, "bpm": _float(item["bpm"], 10, 522)})
                  elif op == "set_swing" and set(item) == {"op", "swing"}:
                      result.append({"op": op, "swing": _float(item["swing"], 0, 1)})
                  elif op == "set_time_signature" and set(item) == {"op", "numerator", "denominator"}:
                      num = _int(item["numerator"], 1, 32)
                      den = _int(item["denominator"], 2, 16)
                      if den not in (2, 4, 8, 16):
                          raise ValueError("Dénominateur invalide.")
                      result.append({"op": op, "numerator": num, "denominator": den})
                  elif op in ("add_channel", "add_pattern") and set(item) <= {"op", "name"}:
                      result.append({"op": op, **({"name": _short_str(item["name"], 64)} if "name" in item else {})})
                  elif op == "add_track" and set(item) == {"op"}:
                      result.append({"op": op})
                  elif op == "set_info" and set(item) == {"op", "title"}:
                      result.append({"op": op, "title": _short_str(item["title"], 110)})
                  elif op == "add_notes" and set(item) == {"op", "pattern", "notes"}:
                      pid = _int(item["pattern"], 1, 2**32 - 1)
                      if pid not in pattern_ids:
                          raise ValueError("Le pattern indiqué par l'IA n'existe pas encore.")
                      notes = item["notes"]
                      if not isinstance(notes, list) or not 1 <= len(notes) <= 64:
                          raise ValueError("Ajoute entre 1 et 64 notes par commande.")
                      clean_notes = []
                      for note in notes:
                          if not isinstance(note, dict) or set(note) - {"channel", "position", "length", "key", "velocity", "pan"}:
                              raise ValueError("Champs de note invalides.")
                          if not {"channel", "position", "length", "key"} <= set(note):
                              raise ValueError("La note doit indiquer channel, position, length et key.")
                          cid = _int(note["channel"], 1, 2**32 - 1)
                          if cid not in channel_ids:
                              raise ValueError("Le canal indiqué par l'IA n'existe pas encore.")
                          n = {"channel": cid, "position": _int(note["position"], 0, ppq * 256),
                               "length": _int(note["length"], 1, ppq * 16), "key": _int(note["key"], 0, 127),
                               "velocity": _int(note.get("velocity", 100), 1, 128), "pan": _int(note.get("pan", 64), 0, 128)}
                          clean_notes.append(n)
                      result.append({"op": op, "pattern": pid, "notes": clean_notes})
                  else:
                      raise ValueError(f"Commande non autorisée ou paramètres invalides : {op!r}.")
              return msg, result
          
          
          def project_summary(state: dict) -> dict:
              return {"tempo": state.get("tempo"), "ppq": state.get("ppq"),
                      "channels": [{"id": c.get("id"), "name": c.get("name"), "kind": c.get("kind")} for c in state.get("channels", [])[:20]],
                      "patterns": [{"id": p.get("id"), "name": p.get("name"), "notes": p.get("notes")} for p in state.get("patterns", [])[:20]],
                      "mixer": [{"id": m.get("id"), "name": m.get("name")} for m in state.get("mixer", [])[:15]]}
          
          
          def api_post(url: str, headers: dict, payload: dict) -> dict:
              req = urllib.request.Request(url, data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                                           headers={"Content-Type": "application/json", **headers}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=55) as response:
                      return json.loads(response.read(2_000_000).decode("utf-8"))
              except urllib.error.HTTPError as e:
                  msg = e.read(2048).decode("utf-8", "replace")
                  raise RuntimeError(f"Erreur API HTTP {e.code} : {msg[:500]}") from None
              except urllib.error.URLError as e:
                  raise RuntimeError(f"Connexion au fournisseur IA impossible : {e.reason}") from None
          
          
          def online_plan(text: str, state: dict, provider: str, model: str, api_key: str) -> dict:
              payload = json.dumps({"demande": text[:1500], "etat_du_projet": project_summary(state)}, ensure_ascii=False)
              model = _short_str(model, 120)
              if provider == OPTIONS[1]:
                  if not api_key.strip():
                      raise ValueError("Saisis ta clé API OpenAI (ton abonnement ChatGPT ne suffit pas).")
                  response = api_post("https://api.openai.com/v1/responses", {"Authorization": "Bearer " + api_key.strip()},
                                      {"model": model, "instructions": SYSTEM_PROMPT, "input": payload, "max_output_tokens": 1500})
                  output_text = response.get("output_text", "")
                  if not output_text:
                      output_text = "\n".join(content.get("text", "") for out in response.get("output", [])
                                              for content in out.get("content", []) if content.get("type") == "output_text")
                  return parse_json_answer(output_text)
              if provider == OPTIONS[2]:
                  if not api_key.strip():
                      raise ValueError("Saisis ta clé API Anthropic (ton abonnement Claude ne suffit pas).")
                  response = api_post("https://api.anthropic.com/v1/messages",
                                      {"x-api-key": api_key.strip(), "anthropic-version": "2023-06-01"},
                                      {"model": model, "max_tokens": 1500, "system": SYSTEM_PROMPT,
                                       "messages": [{"role": "user", "content": payload}]})
                  output_text = "\n".join(c.get("text", "") for c in response.get("content", []) if c.get("type") == "text")
                  return parse_json_answer(output_text)
              if provider == OPTIONS[3]:
                  response = api_post("http://127.0.0.1:11434/api/generate", {},
                                      {"model": model, "prompt": SYSTEM_PROMPT + "\n" + payload, "stream": False})
                  return parse_json_answer(response.get("response", ""))
              return offline_plan(text)
          
          
          class LemonRpc:
              def __init__(self, port: int, token: str):
                  self.port = port
                  self.token = token
          
              def call(self, method: str, **params):
                  # Per-request connections are intentional: no shared socket across Tk workers.
                  with socket.create_connection(("127.0.0.1", self.port), timeout=6) as conn:
                      conn.settimeout(12)
                      f = conn.makefile("r", encoding="utf-8")
                      def send(name, data):
                          data = json.dumps({"jsonrpc": "2.0", "id": 1 if name == "hello" else 2,
                                             "method": name, "params": data}, ensure_ascii=False) + "\n"
                          conn.sendall(data.encode("utf-8"))
                          line = f.readline()
                          if not line:
                              raise ConnectionError("Lemon Studio a fermé la connexion.")
                          out = json.loads(line)
                          if "error" in out:
                              raise RuntimeError("Lemon Studio : " + out["error"].get("message", "Erreur inconnue"))
                          return out.get("result")
                      send("hello", {"name": "Assistant IA FR", "token": self.token})
                      return send(method, params)
          
          
          def local_port() -> int:
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  return s.getsockname()[1]
          
          
          class AssistantApp:
