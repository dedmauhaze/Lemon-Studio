                  self.chat = ScrolledText(self.root, height=16, wrap="word", bg="#141c28", fg=ink,
                                           insertbackground=ink, relief="flat", padx=13, pady=12, font=("Segoe UI", 10), state="disabled")
                  self.chat.pack(fill=BOTH, expand=True, padx=18, pady=(7, 12))
                  self.chat.tag_configure("user", foreground="#f2bd55", spacing1=5, spacing3=5)
                  self.chat.tag_configure("assistant", foreground=ink, spacing1=5, spacing3=9)
                  self.chat.tag_configure("system", foreground="#b2c8e2", spacing1=5, spacing3=10)
                  self._chat("system", "NOUVEAU V0.5 — Protection du niveau audio : baisse préventive des volumes de chaque canal et du master, réduction des transpositions excessives des samples, et un seul déclenchement MIDI pour les samples d'accords pré-enregistrés. Les fichiers de tes packs restent inchangés. Le résultat reste une maquette, sans véritable mastering ni écoute automatique du mix.\n\nLe bouton « Proposer » conserve les anciennes commandes.\n")
          
                  ttk.Label(self.root, text="Ton instruction", background=bg, foreground=ink,
                            font=("Segoe UI", 10, "bold")).pack(anchor="w", padx=18)
