                  tiny_wav(a/'Kicks'/'Frenchcore_Kick_01.wav',0.45)
                  tiny_wav(a/'Snares'/'Hardcore_Snare_02.wav',0.3)
                  tiny_wav(b/'Melody Leads'/'Dark_Lead_OneShot.wav',1.3)
                  config=base/'AppData'/'Lemon Studio';config.mkdir(parents=True)
                  (config/'browser_folders.txt').write_text(str(a)+'\tKicks\n'+str(b)+'\tSynths\n',encoding='utf-8')
                  roots=discover_pack_roots(base/'AppData')
