                  adds=[c for name,params in fake2.calls if name=='apply' for c in params['commands'] if c['op']=='add_channel']
                  assert len(adds)==3 and all('sample' in c and 'plugin' not in c for c in adds)
                  assert set(got['chosen_samples'])=={'kick','snare','lead'} and len(got['missing_roles'])==4
                  applied=[c for name,params in fake2.calls if name=='apply' for c in params['commands']]
                  master=[c for c in applied if c['op']=='set_main_volume']
                  gains=[c for c in applied if c['op']=='set_channel']
                  assert len(master)==1 and 0<master[0]['volume']<0.8
                  assert len(gains)==3 and all(0<g['volume']<0.78125 for g in gains)
                  assert len({g['channel'] for g in gains})==3
                  chord_notes=[note(1,0,96,60), note(1,0,96,64), note(1,0,96,67),note(1,96,96,72)]
                  guarded=sample_safe_notes('pad',chord_notes,'Reggae_Chords_01.wav')
                  assert [x['position'] for x in guarded]==[0,96] and all(x['key']==60 for x in guarded)
                  high=sample_safe_notes('lead',[note(1,0,96,96),note(1,48,48,100)],'Lead_OneShot.wav')
                  assert all(48<=x['key']<=72 for x in high)
              print("Lemon Composer Packs + Grooves + Mix Protection: self-tests OK",out)
          
          if __name__=="__main__":self_test()
