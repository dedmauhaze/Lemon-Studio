                      ns=section_notes(part,sec,bars,96,p,123)
                      assert all(n["channel"]==123 and n["length"]>0 and n["position"]>=0 for n in ns)
              class FakeRpc:
                  def __init__(self):self.uid=100;self.calls=[]
                  def call(self,method,**params):
                      self.calls.append((method,params))
                      if method=="state":return {"ppq":96}
                      if method=="plugins":return {"instruments":["Citrus","Lemon Trio"]}
                      if method=="apply":
                          res=[]
                          for item in params["commands"]:
                              if item["op"] in ("add_channel","add_pattern","add_clip"):
                                  self.uid+=1
                                  res.append({{"add_channel":"channel","add_pattern":"pattern","add_clip":"clip"}[item["op"]]:self.uid})
                              else:res.append(None)
